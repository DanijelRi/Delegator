document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act], [data-mic]');
  if (!el) return;
  if (el.tagName === 'A' && (el.getAttribute('href') === '#' || el.dataset.act === 'viewFile')) e.preventDefault();
  if (el.dataset.mic) { e.preventDefault(); return toggleMic(el); }
  if (el.tagName === 'SELECT') return; // padajući izbornici se obrađuju na 'change'
  const id = Number(el.dataset.id);
  const act = el.dataset.act;
  if (act !== 'toggle') e.stopPropagation();
  switch (act) {
    case 'view': S.view = el.dataset.v; S.q = ''; if (S.view === 'admin') S.admin = null; save();
      if (el.closest('dialog')?.open) el.closest('dialog').close(); window.scrollTo(0, 0); return render();
    case 'more': return moreSheet();
    case 'theme': return setTheme(el.dataset.theme);
    case 'topic': S.topicId = id; S.view = 'topics'; S.q = ''; save(); return render();
    case 'clearSearch': S.q = ''; return render();
    case 'statsDays': S.stats.days = Number(el.dataset.v); return render();
    case 'exportCsv': return downloadCsv();
    case 'printReport': return printReport();
    case 'toggleSub': { const x = S.data.subtasks.find((y) => y.id === id); x.done = el.checked;
      await run('toggleSub', { id, done: el.checked }); const k = S.data.tasks.find((t) => t.id === x.task_id);
      if ($('#dlg').open && k && $('#dlg .steps-block')) taskInfo(k);
      if (x.done) flash(`.step:has([data-act="toggleSub"][data-id="${id}"])`); return; }
    case 'delSub': return run('deleteSub', { id });
    case 'saveTemplate': return templateDialog(topic(id));
    case 'delTemplate': {
      const x = S.data.templates.find((y) => y.id === id);
      if (confirm(`Obrisati predložak „${x.name}“? Teme napravljene iz njega ostaju.`)) { $('#dlg').close(); run('deleteTemplate', { id }); }
      return;
    }
    case 'mergeMe': {
      const d = person(id);
      if (d && confirm(`Spojiti „${d.name}“ s „⭐ Ja“?\n\nSvi zadaci i bilješke te osobe prelaze na tebe, a „${d.name}“ se briše iz popisa ljudi. Njena poveznica za dijeljenje prestaje raditi.`)) await run('mergeIntoMe', { id });
      return;
    }
    case 'shareLink': if ($('#dlg').open) $('#dlg').close(); return shareDialog(id);
    case 'shareReset': if (confirm('Napraviti novu poveznicu? Stara odmah prestaje raditi pa osobi trebaš poslati novu.')) return shareDialog(id, true); return;
    case 'seenAll': return run('markSeen', { ids: unseen().map((n) => n.id) });
    case 'pushToggle': return pushToggle(el);
    case 'backupNow': {
      el.disabled = true; el.textContent = 'Spremam…';
      const r = await fetch('/api/backup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => null);
      const j = await r?.json().catch(() => ({}));
      toast(r?.ok ? `💾 Kopija spremljena (${fmtSize(j.bytes || 0)})` : 'Kopija nije uspjela'); return loadAdmin();
    }
    case 'tourNext': {
      if (S.tour?.step === 0 && $('#tour-demo')?.checked && !hasDemo()) {
        el.disabled = true; el.textContent = 'Pripremam primjere…';
        await run('createDemo');
        const t = S.data.topics.find((x) => x.is_demo && !x.parent_id); if (t) S.topicId = t.id;
      }
      if (S.tour?.step === 0 && !S.user?.onboarded) run('onboarded'); // vodič se ne nudi ponovno ni ako se prekine
      return tourGo(Math.min(TOUR.length - 1, (S.tour?.step || 0) + 1));
    }
    case 'tourPrev': return tourGo(Math.max(0, S.tour.step - 1));
    case 'tourEnd': return tourEnd();
    case 'tourStart': $('#dlg').close(); return tourGo(0);
    case 'addDemo': {
      $('#dlg').close(); await run('createDemo');
      const t = S.data.topics.find((x) => x.is_demo && !x.parent_id);
      if (t) { S.view = 'topics'; S.topicId = t.id; save(); render(); }
      return toast('🎓 Primjeri dodani');
    }
    case 'deleteDemo': {
      const own = S.data.tasks.filter((k) => S.data.topics.find((t) => t.id === k.topic_id)?.is_demo).length;
      if (!confirm(`Obrisati sve primjere (probnu temu s ${own} zadataka, osobe „primjer“ i probnu bilješku)? Tvoji ostali podaci ostaju netaknuti.`)) return;
      await run('deleteDemo'); return toast('Primjeri obrisani ✓');
    }
    case 'qaPhotoDel': return setQaPhoto(null);
    case 'viewFile': { const a = S.data.attachments.find((x) => x.id === id); return a && viewFile(a); }
    case 'delFile': {
      const a = S.data.attachments.find((x) => x.id === id);
      if (!a || !confirm(`Obrisati prilog „${a.name}“?`)) return;
      if ($('#dlg').open) $('#dlg').close();
      const res = await fetch(`/api/files?id=${id}`, { method: 'DELETE' }).catch(() => null);
      if (!res?.ok) return toast('Prilog nije obrisan');
      S.data.attachments = S.data.attachments.filter((x) => x.id !== id); render(); toast('Prilog obrisan');
      return;
    }
    case 'openPnotes': S.view = 'pnotes'; save(); return render();
    case 'pinPnote': { const n = S.data.pnotes.find((x) => x.id === id); return run('pinPnote', { id, pinned: !n.pinned }); }
    case 'editPnote': return pnoteDialog(S.data.pnotes.find((x) => x.id === id));
    case 'delPnote': {
      const n = S.data.pnotes.find((x) => x.id === id), f = filesOf('pnote', id).length;
      if (confirm(`Obrisati bilješku${n.title ? ` „${n.title}“` : ''}${f ? ` i ${f} priloga` : ''}?`)) run('deletePnote', { id });
      return;
    }
    case 'calMode': S.cal.mode = el.dataset.v; save(); return render();
    case 'calList': S.view = 'calendar'; S.cal.mode = 'list'; save(); return render();
    case 'boardNew': return newTaskOnDay('');
    case 'boardAllDone': S.board.allDone = true; save(); return render();
    case 'ical': if ($('#dlg').open) $('#dlg').close(); return icalDialog();
    case 'install': $('#dlg').close(); if (installEvt) { installEvt.prompt(); installEvt = null; } return;
    case 'icalReset': if (confirm('Napraviti novu poveznicu? Stara odmah prestaje raditi, pa ćeš se u kalendaru morati ponovno pretplatiti.')) return icalDialog(true); return;
    case 'calNav': {
      const v = Number(el.dataset.v), a = parseDate(S.cal.anchor || today());
      S.cal.anchor = v === 0 ? today() : isoDate(S.cal.mode === 'week' ? addDays(a, 7 * v) : new Date(a.getFullYear(), a.getMonth() + v, 1));
      return render();
    }
    case 'calDone': S.cal.done = el.checked; save(); return render();
    case 'calTask': { const k = S.data.tasks.find((x) => x.id === id); return k && taskInfo(k); }
    case 'calDay': return dayDialog(el.dataset.day);
    case 'calNew': if ($('#dlg').open) $('#dlg').close(); return newTaskOnDay(el.dataset.day);
    case 'infoStatus': {
      const k = S.data.tasks.find((x) => x.id === id);
      await setTaskStatus(id, k.status === 'done' ? 'todo' : 'done');
      const k2 = S.data.tasks.find((x) => x.id === id); if (k2 && $('#dlg').open) taskInfo(k2);
      return;
    }
    case 'infoEdit': $('#dlg').close(); return taskDialog(S.data.tasks.find((x) => x.id === id));
    case 'infoOpen': {
      const k = S.data.tasks.find((x) => x.id === id);
      $('#dlg').close(); S.view = 'topics'; S.topicId = k.topic_id; S.open.add(id); S.statusFilter = k.status === 'done' ? 'all' : S.statusFilter; S.q = '';
      save(); render(); setTimeout(() => document.querySelector(`.task-head[data-id="${id}"]`)?.scrollIntoView({ block: 'center' }), 30);
      return;
    }
    case 'netOpt': S.net[el.dataset.k] = el.checked; save(); return render();
    case 'netFit': return cy?.fit(undefined, 30);
    case 'netFocus': S.net.topic = id; save(); return render();
    case 'netClose': cy?.elements().removeClass('faded'); $('#net-info').hidden = true; return;
    case 'mailTask': return mailTask(id, Number(el.dataset.pid) || null);
    case 'mailPerson': {
      const p = person(id);
      return openMail([p.email], 'Tvoji otvoreni zadaci', personSummary(id));
    }
    case 'userMenu': return userMenu();
    case 'changePw': $('#dlg').close(); return changePwDialog();
    case 'logout':
      $('#dlg').close();
      try { await authOp('logout'); } catch {}
      try { await caches.delete('delegator-data'); } catch {}
      Object.assign(S, { user: null, loaded: false, needLogin: true, auth: { mode: 'login' }, admin: null, q: '',
        data: { people: [], topics: [], tasks: [], notes: [], pnotes: [], attachments: [], subtasks: [], templates: [] } });
      S.open.clear();
      return render();
    case 'toLogin': history.replaceState(null, '', location.pathname); S.auth = { mode: 'login' }; return render();
    case 'copyText':
      try { await navigator.clipboard.writeText(el.dataset.text); toast('Kopirano ✓'); } catch { toast('Označi poveznicu i kopiraj ručno'); }
      return;
    case 'resetUser': {
      const u = S.admin.users.find((x) => x.id === id);
      try {
        const r = await authOp('createReset', { user_id: id });
        const url = `${location.origin}/?reset=${r.token}`;
        S.admin.link = { label: `Poveznica za novu lozinku — ${u.name} (vrijedi ${r.hours} h)`, url,
          subject: 'Delegator — nova lozinka', body: `Bok ${u.name.split(' ')[0]},\n\novdje postavi novu lozinku za Delegator:\n${url}\n\nPoveznica vrijedi ${r.hours} sata.` };
        loadAdmin();
      } catch (e) { toast(e.message); }
      return;
    }
    case 'delUser': {
      const u = S.admin.users.find((x) => x.id === id);
      if (prompt(`Ovo trajno briše korisnika ${u.name} i SVE njegove teme, zadatke, ljude i bilješke.\nZa potvrdu upiši njegov e-mail:`) !== u.email) return toast('Nije obrisano');
      try { await authOp('deleteUser', { user_id: id }); toast('Korisnik obrisan'); loadAdmin(); } catch (e) { toast(e.message); }
      return;
    }
    case 'filter': S.statusFilter = el.dataset.v; return render();
    case 'toggle': if (e.target.closest('button, a, input, textarea, select, form')) return;
      S.open.has(id) ? S.open.delete(id) : S.open.add(id);
      if (S.open.has(id)) { const u = unseen().filter((n) => n.task_id === id).map((n) => n.id); if (u.length) run('markSeen', { ids: u }); }
      return render();
    case 'status': { const k = S.data.tasks.find((x) => x.id === id); return setTaskStatus(id, NEXT_STATUS[k.status]); }
    case 'chip': el.classList.toggle('on'); el.dataset.manual = '1'; return;
    case 'quick': return quickStep1();
    case 'newTopic': return topicDialog(null);
    case 'newSubtopic': return topicDialog(null, id);
    case 'twisty': S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); save(); return render();
    case 'withSub': S.withSub = el.checked; save(); return render();
    case 'editTopic': return topicDialog(topic(id));
    case 'delTopic': {
      const n = topicSubtree(id).size - 1;
      if (confirm(`Obrisati temu${n ? ` i ${n} podtema` : ''} sa svim zadacima i bilješkama? Ovo se ne može vratiti.`)) {
        $('#dlg').close(); S.topicId = topic(id)?.parent_id || null; run('deleteTopic', { id });
      }
      return;
    }
    case 'editTask': return taskDialog(S.data.tasks.find((x) => x.id === id));
    case 'delTask': if (confirm('Obrisati zadatak i njegove bilješke?')) { $('#dlg').close(); run('deleteTask', { id }); } return;
    case 'editNote': return noteDialog(S.data.notes.find((x) => x.id === id));
    case 'delNote': { const f = filesOf('note', id).length; if (confirm(`Obrisati bilješku${f ? ` i ${f} priloga` : ''}?`)) run('deleteNote', { id }); return; }
    case 'editPerson': return personDialog(person(id));
    case 'delPerson': if (confirm(`Ukloniti osobu ${person(id).name}? Bit će maknuta sa svih zadataka.`)) run('deletePerson', { id }); return;
    case 'openPerson': S.personId = id; S.view = 'person'; S.q = ''; save(); return render();
    case 'copyPerson': {
      const text = personSummary(id);
      try { await navigator.clipboard.writeText(text); toast('Popis kopiran — zalijepi u poruku ili mail'); }
      catch { openDialog(`<h2>Popis zadataka</h2><textarea rows="12">${esc(text)}</textarea>`, () => {}); }
      return;
    }
  }
});

// Nova osobna bilješka s prilozima: spremi bilješku pa priloži datoteke.
async function uploadToNewPnote(form, files) {
  const title = form.title.value.trim(), body = form.body.value.trim();
  const color = form.querySelector('[name=pncolor]:checked')?.value || '';
  form.reset(); // prije spremanja, inače ga render() vrati kao nacrt
  const d = await api({ op: 'addPnote', title: title || files.map((f) => f.name).join(', '), body, color }).catch(() => null);
  if (!d?.result?.pnote_id) return;
  await uploadFiles(`pnote:${d.result.pnote_id}`, files);
}
document.addEventListener('change', (e) => {
  const inp = e.target;
  if (inp.type === 'file' && inp.files?.length) {
    const files = [...inp.files]; inp.value = '';
    if (inp.dataset.upload) return uploadFiles(inp.dataset.upload, files);
    if ('uploadNewNote' in inp.dataset) return uploadToNewNote(inp.closest('form'), files);
    if ('uploadNewPnote' in inp.dataset) return uploadToNewPnote(inp.closest('form'), files);
    if ('qaPhoto' in inp.dataset) return setQaPhoto(files[0]);
    return;
  }
  const act = e.target.dataset.act, v = Number(e.target.value);
  if (act === 'pickPerson') { S.personId = v; save(); render(); }
  if (act === 'calPerson') { S.cal.person = v; save(); render(); }
  if (act === 'calTopic') { S.cal.topic = v; save(); render(); }
  if (act === 'boardPerson') { S.board.person = v; save(); render(); }
  if (act === 'boardTopic') { S.board.topic = v; save(); render(); }
  if (act === 'netTopic') { S.net.topic = v; save(); render(); }
  if (act === 'netLayout') { S.net.layout = e.target.value; S.netCache = null; save(); render(); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { S.q = e.target.value; render(); return; }

  // automatski označi ljude spomenute u naslovu novog zadatka
  if (e.target.id === 'nt-title' || e.target.id === 'nt-desc') {
    const form = e.target.form;
    const found = peopleInText(form.title.value + ' ' + form.description.value);
    form.querySelectorAll('[data-chips] .chip').forEach((c) => {
      if (c.dataset.manual) return;
      c.classList.toggle('on', found.includes(Number(c.dataset.id)));
    });
  }
});

// Kalendar: povuci zadatak na drugi dan = novi rok
let dragTask = null, dragFrom = null;
document.addEventListener('dragstart', (e) => {
  const kc = e.target.closest?.('.kcard');
  if (kc) { dragTask = Number(kc.dataset.id); dragFrom = 'board'; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', kc.dataset.id); return; }
  const chip = e.target.closest?.('.cchip');
  if (!chip || chip.classList.contains('ghost')) return;
  dragTask = Number(chip.dataset.id);
  dragFrom = chip.closest('[data-day]')?.dataset.day || null;
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragTask));
});
// Datoteke povučene s računala na zadatak, bilješku ili temu
const fileDrag = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
const dropTarget = (e) => e.target.closest?.('[data-dropzone], form[data-form="note"], form[data-form="pnote"], form[data-qa="parse"]');
document.addEventListener('dragover', (e) => {
  if (fileDrag(e)) {
    const z = dropTarget(e);
    document.querySelectorAll('.drop').forEach((x) => x !== z && x.classList.remove('drop'));
    if (z) { e.preventDefault(); z.classList.add('drop'); }
    return;
  }
  const col = dragTask && dragFrom === 'board' && e.target.closest?.('.kcol');
  if (col) { e.preventDefault(); document.querySelectorAll('.drop').forEach((x) => x !== col && x.classList.remove('drop')); col.classList.add('drop'); return; }
  const day = dragTask && dragFrom !== 'board' && e.target.closest?.('[data-day].cday, [data-day].cl-day');
  if (!day) return;
  e.preventDefault();
  document.querySelectorAll('.drop').forEach((x) => x !== day && x.classList.remove('drop'));
  day.classList.add('drop');
});
document.addEventListener('drop', (e) => {
  if (fileDrag(e)) {
    const z = dropTarget(e);
    document.querySelectorAll('.drop').forEach((x) => x.classList.remove('drop'));
    if (!z) return;
    e.preventDefault();
    const files = [...e.dataTransfer.files];
    if (z.dataset.dropzone) return uploadFiles(z.dataset.dropzone, files);
    if (z.dataset.qa === 'parse') return setQaPhoto(files[0]);
    return z.dataset.form === 'note' ? uploadToNewNote(z, files) : uploadToNewPnote(z, files);
  }
  const col = dragTask && dragFrom === 'board' && e.target.closest?.('.kcol');
  if (col) {
    e.preventDefault();
    const id = dragTask; dragTask = null;
    const k = S.data.tasks.find((x) => x.id === id);
    if (k && k.status !== col.dataset.status) setTaskStatus(id, col.dataset.status); else render();
    return;
  }
  const day = dragTask && e.target.closest?.('[data-day].cday, [data-day].cl-day');
  if (!day) return;
  e.preventDefault();
  const id = dragTask; dragTask = null;
  const k = S.data.tasks.find((x) => x.id === id);
  // pomak = koliko je dana čip pomaknut (radi i kad se povuče srednji dan višednevnog zadatka)
  const shift = dragFrom ? Math.round((parseDate(day.dataset.day) - parseDate(dragFrom)) / 864e5) : 0;
  const due = k?.due_date ? isoDate(addDays(parseDate(k.due_date), shift)) : day.dataset.day;
  if (k && due !== k.due_date) run('setDue', { id, due_date: due }).then(() => toast(`Rok: ${fmtDate(due)}`));
  else render();
});
document.addEventListener('dragend', () => { dragTask = null; document.querySelectorAll('.drop').forEach((x) => x.classList.remove('drop')); });

// Zalijepljena slika (npr. snimka zaslona) u bilješku ili zadatak postaje prilog
document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;
  if (e.target.closest?.('form[data-qa="parse"]') && files[0].type.startsWith('image/')) { e.preventDefault(); return setQaPhoto(files[0]); }
  const z = e.target.closest?.('[data-dropzone], form[data-form="note"], form[data-form="pnote"], .task-body');
  if (!z) return;
  e.preventDefault();
  if (z.dataset.dropzone) return uploadFiles(z.dataset.dropzone, files);
  if (z.dataset.form === 'note') return uploadToNewNote(z, files);
  if (z.dataset.form === 'pnote') return uploadToNewPnote(z, files);
  const tz = z.querySelector('[data-dropzone^="task:"]'); if (tz) uploadFiles(tz.dataset.dropzone, files);
});

// Enter u bilješci = spremi (Shift+Enter = novi red); Esc u tražilici = očisti
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && e.target.id === 'search' && S.q) { e.preventDefault(); S.q = ''; render(); return; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('form[data-form="note"] textarea')) {
    e.preventDefault(); e.target.form.requestSubmit();
  }
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  const kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (activeRec) activeRec.rec.stop();
  const fd = Object.fromEntries(new FormData(f));
  if (kind === 'login' || kind === 'signup' || kind === 'reset') {
    const btn = $('button.primary', f); btn.disabled = true;
    try {
      if (kind === 'login') await authOp('login', fd);
      if (kind === 'signup') await authOp('signup', { ...fd, invite: S.auth.mode === 'setup' ? fd.invite : S.auth.token });
      if (kind === 'reset') await authOp('resetPassword', { token: S.auth.token, password: fd.password });
      history.replaceState(null, '', location.pathname);
      S.auth = { mode: 'login' };
      await api().catch(() => {});
      if (S.loaded && S.user && !S.user.onboarded) tourGo(0);
      return;
    } catch (err) { $('.auth-err', f).textContent = err.message; btn.disabled = false; return; }
  }
  if (kind === 'invite') {
    try {
      const r = await authOp('createInvite', fd);
      const url = `${location.origin}/?pozivnica=${r.token}`;
      S.admin.link = { label: `Pozivnica${fd.note ? ' — ' + fd.note : ''} (vrijedi ${r.days} dana)`, url,
        subject: `${S.user.name} te poziva u Delegator`,
        body: `Bok,\n\npozivam te u Delegator — aplikaciju za teme, zadatke i bilješke.\nNapravi račun ovdje:\n${url}\n\nPoveznica vrijedi ${r.days} dana.\n\n— ${S.user.name}` };
      loadAdmin();
    } catch (err) { toast(err.message); }
    return;
  }
  if (kind === 'newPerson') {
    if (!fd.name.trim()) return;
    f.reset(); await run('addPerson', fd); return;
  }
  if (kind === 'newTask') {
    if (!fd.title.trim()) return toast('Upiši naziv zadatka');
    const people = selectedChips(f);
    f.reset();
    await run('addTask', { ...fd, topic_id: Number(f.dataset.topic), people });
    return;
  }
  if (kind === 'sub') {
    const title = fd.title.trim(); if (!title) return;
    f.reset(); await run('addSub', { task_id: Number(f.dataset.task), title });
    setTimeout(() => document.querySelector(`form[data-form="sub"][data-task="${f.dataset.task}"] input`)?.focus(), 30);
    return;
  }
  if (kind === 'pnote') {
    if (!fd.title.trim() && !fd.body.trim()) return toast('Upiši naslov ili tekst bilješke');
    f.reset(); // prije spremanja: render() bi inače vratio tekst iz polja kao nacrt
    await run('addPnote', { title: fd.title, body: fd.body, color: fd.pncolor });
    return;
  }
  if (kind === 'note') {
    if (!fd.body.trim()) return;
    f.reset();
    await run('addNote', { task_id: Number(f.dataset.task), person_id: Number(f.dataset.person) || null, body: fd.body });
  }
});

/* ========= pokretanje ========= */
async function boot() {
  render();
  const params = new URLSearchParams(location.search);
  const inv = params.get('pozivnica'), rst = params.get('reset');
  let me = { user: null, setup: false };
  try { me = await (await fetch('/api/auth')).json(); } catch { toast('Nema veze s poslužiteljem'); }
  if (rst) {
    S.auth = { mode: 'reset', token: rst, info: await authOp('tokenInfo', { token: rst, kind: 'reset' }).catch(() => ({ valid: false })) };
    S.needLogin = true; return render();
  }
  if (me.user) {
    if (inv) toast('Već si prijavljen');
    const v = params.get('v'), quick = params.get('brzi');
    if (v && ['overview', 'topics', 'board', 'calendar', 'network', 'person', 'people', 'pnotes', 'stats'].includes(v)) { S.view = v; save(); }
    if (location.search) history.replaceState(null, '', location.pathname);
    await api().catch(() => {});
    if (quick && S.loaded && !S.offline) quickStep1();
    else if (S.loaded && !S.offline && S.user && !S.user.onboarded) tourGo(0);
    return;
  }
  if (inv) S.auth = { mode: 'signup', token: inv, info: await authOp('tokenInfo', { token: inv }).catch(() => ({ valid: false })) };
  else S.auth = { mode: me.setup ? 'setup' : 'login' };
  S.needLogin = true; render();
}
boot();
</script>
