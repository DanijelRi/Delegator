<style>
  /* Font Inter (lokalno u vendor/fonts, latinica + hrvatska slova) */
  @font-face { font-family: 'Inter'; font-style: normal; font-display: swap; font-weight: 100 900;

  @font-face { font-family: 'Inter'; font-style: normal; font-display: swap; font-weight: 100 900;

    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  /* Boje kao varijable: svijetla tema ovdje, tamna ispod (automatski po uređaju ili ručno u izborniku 👤). */
  :root {
    color-scheme: light;
    --bg: #f3f4f8; --card: #fff; --ink: #1a1f2b; --muted: #677084; --line: #e5e7ee; --line-strong: #cdd2dd;
    --soft: #f7f8fa; --hover: #f0f2f6; --track: #eceef3; --input: #fff;
    --accent: #4f6bed; --accent-solid: #4f6bed; --accent-ink: #3d58d8; --accent-soft: #eef1fe; --danger: #d64545; --ok: #2f9e6b; --warn: #d98b1a;
    --st-todo-bg: #eef0f4; --st-todo: #4a5266; --st-doing-bg: #fff1dc; --st-doing: #a3650c; --st-done-bg: #e3f5ec; --st-done: #1f7a50;
    --mark: #ffe58a; --from-person: #eef5ff; --unseen-bg: #fff8f8; --demo-bg: #fff8e1; --demo-line: #f3dfa2; --pdf-bg: #e9ecf2; --bar-new: #c9d1f6;
    --pnote-mix: 100%;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow: 0 4px 14px rgba(16,24,40,.08), 0 1px 3px rgba(16,24,40,.05);
    --shadow-lg: 0 20px 48px rgba(16,24,40,.20);
    --glass: rgba(255,255,255,.82);
    --radius: 14px; --radius-sm: 10px;
    --ease: cubic-bezier(.2,.8,.2,1);
    --tabbar-h: 0px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1117; --card: #171b24; --ink: #e6e9f0; --muted: #98a0b3; --line: #262c39; --line-strong: #39404f;
    --soft: #1b202a; --hover: #222836; --track: #252b38; --input: #12151d;
    --accent: #7d94ff; --accent-solid: #5a72ee; --accent-ink: #9aacff; --accent-soft: #232a47; --danger: #f07a77; --ok: #4fc08d; --warn: #f0b04a;
    --st-todo-bg: #262c39; --st-todo: #b9c0d0; --st-doing-bg: #3a2c14; --st-doing: #f0b04a; --st-done-bg: #15342a; --st-done: #6fd6a3;
    --mark: #6a5a12; --from-person: #1b2540; --unseen-bg: #2a1b1e; --demo-bg: #2c2613; --demo-line: #4a3f1c; --pdf-bg: #0a0c11; --bar-new: #3b4677;
    --pnote-mix: 22%;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35); --shadow: 0 6px 18px rgba(0,0,0,.4); --shadow-lg: 0 24px 56px rgba(0,0,0,.6);
    --glass: rgba(23,27,36,.82);
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1117; --card: #171b24; --ink: #e6e9f0; --muted: #98a0b3; --line: #262c39; --line-strong: #39404f;
    --soft: #1b202a; --hover: #222836; --track: #252b38; --input: #12151d;
    --accent: #7d94ff; --accent-solid: #5a72ee; --accent-ink: #9aacff; --accent-soft: #232a47; --danger: #f07a77; --ok: #4fc08d; --warn: #f0b04a;
    --st-todo-bg: #262c39; --st-todo: #b9c0d0; --st-doing-bg: #3a2c14; --st-doing: #f0b04a; --st-done-bg: #15342a; --st-done: #6fd6a3;
    --mark: #6a5a12; --from-person: #1b2540; --unseen-bg: #2a1b1e; --demo-bg: #2c2613; --demo-line: #4a3f1c; --pdf-bg: #0a0c11; --bar-new: #3b4677;
    --pnote-mix: 22%;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35); --shadow: 0 6px 18px rgba(0,0,0,.4); --shadow-lg: 0 24px 56px rgba(0,0,0,.6);
    --glass: rgba(23,27,36,.82);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
  button:hover { border-color: var(--line-strong); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
  button.ghost:hover { color: var(--ink); background: var(--hover); }
  button.danger:hover { color: var(--danger); }
  input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--input); width: 100%; }
  textarea { resize: vertical; min-height: 38px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
           display: flex; gap: 12px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  header nav { display: flex; gap: 4px; }
  header nav button { border-color: transparent; }
  header nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  header .search { margin-left: auto; max-width: 260px; }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 96px; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } header .search { max-width: none; width: 100%; order: 3; } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .topic-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .topic-item:hover { background: var(--hover); }
  .topic-item.on { background: var(--accent-soft); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  h2 { font-size: 20px; margin: 0; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .stack > * + * { margin-top: 10px; }

  .task { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .task + .task { margin-top: 8px; }
  .task-head { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; cursor: pointer; }
  .task.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-title { font-weight: 600; }
  .task-body { border-top: 1px solid var(--line); padding: 12px; }
  .status { flex: none; border-radius: 999px; font-size: 12px; padding: 2px 10px; border: 1px solid transparent; white-space: nowrap; }
  .st-todo { background: var(--st-todo-bg); color: var(--st-todo); }
  .st-doing { background: var(--st-doing-bg); color: var(--st-doing); }
  .st-done { background: var(--st-done-bg); color: var(--st-done); }
  .prio-high { color: var(--danger); font-weight: 600; }
  .prio-low { color: var(--muted); }
  .due.late { color: var(--danger); font-weight: 600; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border-radius: 999px; padding: 3px 10px; font-size: 13px; border: 1px solid var(--line); background: var(--card); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.static { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  .notes-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--soft); }
  .notes-block + .notes-block { margin-top: 8px; }
  .note { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .note:last-of-type { border-bottom: 0; }
  .note-body { white-space: pre-wrap; flex: 1; }
  .note-time { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .with-mic { position: relative; display: flex; gap: 6px; align-items: flex-start; }
  .mic { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 8px; font-size: 17px; }
  .mic.rec { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .65; } }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
           padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(520px, 94vw); }
  dialog::backdrop { background: rgba(20, 24, 35, .35); }
  .fab { position: fixed; right: 18px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; font-size: 24px;
         background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(79,107,237,.4); z-index: 6; }
  .qa-text { font-size: 17px; min-height: 110px; }
  .qa-note { display: flex; gap: 6px; align-items: flex-start; }
  .qa-note .lbl { flex: none; width: 110px; font-size: 13px; color: var(--muted); padding-top: 9px; }
  .chip.new { border-style: dashed; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login { max-width: 360px; margin: 10vh auto; }
  .offline { width: 100%; background: var(--st-doing-bg); color: var(--st-doing); font-size: 13px; padding: 4px 10px; border-radius: 6px; text-align: center; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .hits { margin: -4px 0 8px; padding: 6px 12px 8px 24px; border: 1px solid var(--line); border-top: 0;
          border-radius: 0 0 var(--radius) var(--radius); background: var(--soft); }
  .hits > * + * { margin-top: 4px; }
  a { color: var(--accent); }

  /* stablo tema */
  .side { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
  .twisty { width: 14px; flex: none; color: var(--muted); font-size: 11px; text-align: center; }
  .twisty[data-act]:hover { color: var(--ink); }
  .crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--accent); }
  .subcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .subcard { text-align: left; display: flex; flex-direction: column; gap: 2px; border-left: 4px solid; padding: 8px 10px; background: var(--soft); }

  /* kalendar */
  main:has(.cal), main:has(.net-wrap) { max-width: none; padding-bottom: 24px; }
  .cal { display: flex; flex-direction: column; gap: 10px; }
  .cal-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .cal-title { font-size: 22px; min-width: 180px; text-transform: capitalize; }
  .cal-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(118px, 1fr));
              gap: 4px; min-height: max(560px, calc(100vh - 215px)); }
  .cal-grid.week { grid-template-rows: 1fr; }
  .cday { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cday.weekend { background: var(--soft); } .cday.other { opacity: .45; }
  .cday.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cday.drop, .cl-day.drop { background: var(--accent-soft); border-color: var(--accent); }
  .cd-h { display: flex; align-items: center; gap: 4px; font-size: 12px; min-height: 20px; }
  .cd-n { font-weight: 600; } .cday.today .cd-n { color: var(--accent); }
  .hol { font-size: 10px; color: var(--danger); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cd-add { margin-left: auto; padding: 0 6px; line-height: 18px; opacity: 0; } .cday:hover .cd-add { opacity: 1; }
  .cd-more { padding: 0 4px; text-align: left; color: var(--accent); }
  .cchip { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 5px; border-left: 3px solid; border-radius: 4px; cursor: pointer; min-width: 0; }
  .cchip:hover { filter: brightness(.95); }
  .cchip .ct { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cchip .ci { display: flex; gap: 1px; flex: none; }
  .cchip .ci b { font-size: 9px; background: var(--card); border-radius: 3px; padding: 0 2px; color: var(--muted); font-weight: 600; }
  .cchip.st-done .ct { text-decoration: line-through; color: var(--muted); }
  .cchip.late .ct { color: var(--danger); font-weight: 600; }
  .cchip.big { flex-direction: column; align-items: stretch; padding: 5px 8px; font-size: 13px; }
  .cchip.big .ct { white-space: normal; } .cchip .cm { font-size: 11px; color: var(--muted); }
  .cal-list { display: flex; flex-direction: column; gap: 8px; max-width: 900px; }
  .cl-day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
  .cl-day.today { border-color: var(--accent); } .cl-day.late { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
  .cl-h { font-weight: 600; font-size: 14px; } .cl-day .row .cchip { flex: 1; }
  .cal-foot { text-align: center; }
  @media (max-width: 760px) {
    .cal-grid { height: auto; grid-template-rows: repeat(var(--rows), minmax(84px, auto)); gap: 2px; }
    .cal-grid.week { grid-template-columns: 1fr; grid-template-rows: none; }
    .cchip .ci { display: none; } .cday { padding: 2px; } .cchip { font-size: 10px; padding: 1px 3px; }
    .cd-add { opacity: 1; }
  }

  /* pregled */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .stat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: var(--radius); background: var(--card); text-align: left; }
  .stat b { font-size: 28px; line-height: 1; } .stat span { color: var(--muted); font-size: 13px; }
  .stat.bad b { color: var(--danger); } .stat.warn b { color: var(--warn); } .stat.muted b { color: var(--muted); }
  .ov-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .ov-grid { grid-template-columns: 1fr; } }
  .ov-row .cchip { flex: 1; } .ov-row > span { white-space: nowrap; }
  .loadrow { width: 100%; display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 10px; align-items: center; border: 0; padding: 6px 4px; text-align: left; background: none; }
  .loadrow:hover { background: var(--hover); }
  .loadrow .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { position: relative; height: 10px; background: var(--track); border-radius: 6px; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
  .bar i.late { background: var(--danger); } .bar i.ok { opacity: .85; }

  /* ploča */
  main:has(.board) { max-width: none; }
  .kanban { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 12px; align-items: stretch; overflow-x: auto; }
  .kcol { background: var(--track); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: calc(100vh - 230px); border: 2px solid transparent; }
  .kcol.drop { border-color: var(--accent); background: var(--accent-soft); }
  .kh { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
  .kcard { background: var(--card); border: 1px solid var(--line); border-left: 4px solid; border-radius: 8px; padding: 8px 10px; cursor: grab; display: flex; flex-direction: column; gap: 3px; }
  .kcard:hover { box-shadow: 0 2px 8px rgba(20,24,35,.08); }
  .kt { font-weight: 600; } .kp { margin-left: auto; display: flex; gap: 2px; }
  .kp b { font-size: 10px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 4px; }
  .kempty { text-align: center; padding: 18px 0; }
  @media (max-width: 760px) { .kanban { grid-template-columns: repeat(3, 82vw); } .kcol { min-height: 50vh; } }

  /* kalendar: višednevni i ponavljanja */
  .cchip.seg-start { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .cchip.seg-mid, .cchip.seg-end { border-left-style: dotted; }
  .cchip.ghost { border-left-style: dashed; opacity: .7; }
  .btnlink { display: block; text-align: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--card); }
  .btnlink.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* navigacija: na mobitelu se kartice pomiču vodoravno */
  @media (max-width: 760px) { header nav { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; scrollbar-width: none; } header nav button { white-space: nowrap; } header h1 { width: 100%; } }

  /* prilozi */
  .atts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; white-space: normal; }
  .atts.small { margin-top: 4px; }
  .att { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 3px 4px 3px 8px; font-size: 13px; max-width: 100%; }
  .att a { text-decoration: none; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .att a.muted { color: var(--muted); } .att .ghost { padding: 0 6px; }
  .att-img { padding: 0; border-radius: 8px; overflow: hidden; width: 76px; height: 76px; border: 1px solid var(--line); background: var(--hover); }
  .atts.small .att-img { width: 52px; height: 52px; }
  .att-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attach-btn { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px dashed var(--line); background: transparent; white-space: nowrap; }
  .attach-btn:hover { color: var(--accent); border-color: var(--accent); }
  .attach-btn.mic { border-style: solid; justify-content: center; font-size: 17px; padding: 0; }
  .note .attach-btn { border: 0; padding: 2px 6px; }
  .task-files { gap: 8px; }
  [data-dropzone].drop, form.drop { outline: 2px dashed var(--accent); outline-offset: 2px; background: var(--accent-soft); }
  .lightbox { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; background: var(--hover); }
  dialog:has(.lightbox) { width: min(1000px, 96vw); }

  /* dobrodošlica */
  .tour { position: fixed; z-index: 30; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(440px, calc(100vw - 24px));
          background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px;

<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
/* ========= stanje ========= */
const S = {
  data: { people: [], topics: [], tasks: [], notes: [], pnotes: [], attachments: [], subtasks: [], templates: [] },
  view: localStorage.getItem('view') || 'overview', // overview | topics | board | calendar | network | person | people | admin
  topicId: Number(localStorage.getItem('topicId')) || null,
  personId: Number(localStorage.getItem('personId')) || null,
  open: new Set(),                                   // otvoreni zadaci
  statusFilter: 'open',                              // all | open | done
  q: '',
  loaded: false,
  needLogin: false,
  user: null,                                        // prijavljeni korisnik {id, name, email, is_admin}
  auth: { mode: 'login' },                           // login | setup | signup | reset
  admin: null,                                       // podaci za karticu „Korisnici“
  collapsed: new Set(JSON.parse(localStorage.getItem('collapsed') || '[]')), // zatvorene grane stabla tema
  withSub: localStorage.getItem('withSub') !== '0',  // u temi prikaži i zadatke iz podtema
  cal: { mode: matchMedia('(max-width: 760px)').matches ? 'list' : 'month', anchor: null, person: 0, topic: 0, done: true,
         ...JSON.parse(localStorage.getItem('cal') || '{}') },   // kalendar
  net: { tasks: true, done: false, people: true, notes: false, layout: 'cose', topic: 0,
         ...JSON.parse(localStorage.getItem('net') || '{}') },   // mreža
  board: { topic: 0, person: 0, allDone: false, ...JSON.parse(localStorage.getItem('board') || '{}') }, // ploča
  stats: { days: 30 },                               // statistika: razdoblje u danima
};
const COLORS = ['#4f6bed', '#2f9e6b', '#d98b1a', '#d64545', '#8e5bd6', '#1f9bb3', '#6b7385'];
const STATUS = { todo: 'Za napraviti', doing: 'U tijeku', done: 'Gotovo' };
const NEXT_STATUS = { todo: 'doing', doing: 'done', done: 'todo' };
const PRIO = { low: 'Nizak', normal: 'Normalan', high: 'Visok' };
const REPEAT = { '': 'Ne ponavlja se', daily: 'Svaki dan', weekly: 'Svaki tjedan', biweekly: 'Svaka 2 tjedna', monthly: 'Svaki mjesec', yearly: 'Svake godine' };
const repeatSelect = (v = '') => `<select name="repeat" style="width:auto" title="Ponavljanje">${Object.entries(REPEAT)
  .map(([k, l]) => `<option value="${k}" ${k === (v || '') ? 'selected' : ''}>🔁 ${l}</option>`).join('')}</select>`;

/* ========= API ========= */
async function api(body) {
  const res = await fetch('/api/data', {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { S.needLogin = true; S.auth = { mode: 'login' }; render(); throw new Error('login'); }

// Bez interneta: jednostavne promjene (status, korak, nova bilješka) čekaju u redu i šalju se kad se veza vrati.
// Nakon ovih promjena kratka potvrda „✓ Spremljeno“ (ako već nema druge poruke).
const SAVED_OPS = new Set(['addTask', 'updateTask', 'addNote', 'updateNote', 'addPnote', 'updatePnote', 'addPerson', 'updatePerson', 'updateTopic', 'addSub']);
const QUEUEABLE = new Set(['setStatus', 'toggleSub', 'addNote', 'addPnote', 'setDue', 'markSeen']);
const loadQueue = () => { try { return JSON.parse(localStorage.getItem('queue') || '[]'); } catch { return []; } };
const saveQueue = (q) => { try { localStorage.setItem('queue', JSON.stringify(q)); } catch {} };
function applyLocally(op, p) {   // da se promjena odmah vidi
  const k = p.id && S.data.tasks.find((x) => x.id === p.id);
  if (op === 'setStatus' && k) k.status = p.status;
  if (op === 'setDue' && k) k.due_date = p.due_date;
  if (op === 'toggleSub') { const x = S.data.subtasks.find((y) => y.id === p.id); if (x) x.done = p.done; }
  if (op === 'addNote') S.data.notes.push({ id: -Date.now(), task_id: p.task_id, person_id: p.person_id, body: p.body + ' ⏳', created_at: new Date().toISOString() });
  if (op === 'addPnote') S.data.pnotes.unshift({ id: -Date.now(), title: p.title, body: p.body, color: p.color, pinned: false, updated_at: new Date().toISOString() });
  if (op === 'markSeen') S.data.notes.forEach((n) => { if (p.ids.includes(n.id)) n.seen = true; });
}
function queueChange(op, payload) {
  const q = loadQueue(); q.push({ op, payload }); saveQueue(q);
  applyLocally(op, payload); render();
  toast(`⏳ Spremljeno na uređaju — šaljem kad se vrati internet (${q.length})`);
}
let flushing = false;
async function flushQueue() {
  if (!loadQueue().length || flushing || !navigator.onLine) return;
  flushing = true; let sent = 0;
  try {
    while (loadQueue().length) {
      const [first, ...rest] = loadQueue();
      try { await api({ op: first.op, ...first.payload }); }
      catch (e) { if (e instanceof TypeError) throw e; } // veze još nema: pokušaj kasnije; odbijenu promjenu preskoči
      saveQueue(rest); sent++;
    }
  } catch {} finally { flushing = false; }
  if (sent) toast(`✓ Poslano ${sent} promjena spremljenih bez interneta`);
  render();
}
const run = (op, payload = {}) => {
  if (!navigator.onLine || (S.offline && QUEUEABLE.has(op))) {
    if (QUEUEABLE.has(op)) { queueChange(op, payload); return Promise.resolve(); }
    toast('📴 Bez interneta — ova promjena nije moguća dok se veza ne vrati'); return Promise.resolve();
  }
  return api({ op, ...payload }).then((d) => {
    if (SAVED_OPS.has(op) && !document.querySelector('.toast')) toast('Spremljeno', 'ok');
    return d;
  }).catch((e) => {
    if (e instanceof TypeError) { if (QUEUEABLE.has(op)) queueChange(op, payload); else toast('📴 Nema veze s internetom'); }
  });
};

const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---- stablo tema (podteme bilo koje dubine) ---- */
const childTopics = (id) => S.data.topics.filter((t) => (t.parent_id || null) === (id || null) || (!id && t.parent_id && !topic(t.parent_id)));
function topicAncestors(t) {            // od korijena do roditelja
  const out = []; let p = t && topic(t.parent_id);
  while (p && out.length < 50 && !out.includes(p)) { out.unshift(p); p = topic(p.parent_id); }
  return out;
}
const topicPath = (t) => t ? [...topicAncestors(t), t].map((x) => x.title).join(' › ') : '';
function topicSubtree(id) {             // id teme + sve podteme
  const ids = new Set([id]);
  for (let added = true; added;) {
    added = false;
    S.data.topics.forEach((t) => { if (t.parent_id && ids.has(t.parent_id) && !ids.has(t.id)) { ids.add(t.id); added = true; } });
  }
  return ids;
}
function topicTree() {                  // [{t, depth}] redom kao u stablu
  const out = [], seen = new Set();
  const walk = (list, depth) => list.forEach((t) => {
    if (seen.has(t.id)) return; seen.add(t.id);
    out.push({ t, depth }); walk(childTopics(t.id), depth + 1);
  });
  walk(childTopics(null), 0);
  S.data.topics.forEach((t) => { if (!seen.has(t.id)) out.push({ t, depth: 0 }); }); // sigurnosna mreža
  return out;
}
// <option> popis tema s uvlakom; exclude = id-evi koje ne nudimo (npr. tema sama i njene podteme)
const topicOptions = (selected, { exclude = new Set(), hideArchived = false } = {}) => topicTree()
  .filter(({ t }) => !exclude.has(t.id) && (!hideArchived || !t.archived || t.id === selected))
  .map(({ t, depth }) => `<option value="${t.id}" ${t.id === selected ? 'selected' : ''}>${'\u2003'.repeat(depth)}${depth ? '└ ' : ''}${esc(t.title)}</option>`).join('');
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const today = () => isoDate(new Date());
// Rok s početkom: „24.–27.11.2026.“
function fmtSpan(k) {
  if (!k.due_date) return '';
  if (!k.start_date) return fmtDate(k.due_date);
  const [a, b] = [k.start_date.split('-'), k.due_date.split('-')];
  return a[0] === b[0] && a[1] === b[1] ? `${Number(a[2])}.–${fmtDate(k.due_date)}` : `${fmtDate(k.start_date)} – ${fmtDate(k.due_date)}`;
}
// Isto računanje kao na poslužitelju (api/data.js addPeriod): n-ti termin od izvornog datuma.
function addPeriod(iso, repeat, n = 1) {
  const [y, m, d] = iso.split('-').map(Number);
  const days = { daily: 1, weekly: 7, biweekly: 14 }[repeat];
  if (days) return isoDate(new Date(y, m - 1, d + days * n));
  const months = (m - 1) + (repeat === 'yearly' ? 12 * n : n);
  const ny = y + Math.floor(months / 12), nm = months % 12;
  return isoDate(new Date(ny, nm, Math.min(d, new Date(ny, nm + 1, 0).getDate())));
}

// Bez razlike velikih/malih slova i kvačica: „Štand“ = „stand“, „Đuro“ = „duro“.
// Duljina teksta se ne mijenja, pa se pozicije pogodaka mogu označiti u izvornom tekstu.
const fold = (s) => String(s ?? '').normalize('NFC').toLowerCase()
  .replace(/[čćšžđ]/g, (c) => ({ č: 'c', ć: 'c', š: 's', ž: 'z', đ: 'd' }[c]))
  .normalize('NFD').replace(/\p{M}/gu, (m) => '');
// Riječi upita; duže riječi bez zadnjeg slova da se nađu i drugi padeži (Marko → Marku, štand → štandu).
function terms() {
  return fold(S.q).split(/[^\p{L}\p{N}]+/u).filter(Boolean).map((w) => (w.length >= 5 ? w.slice(0, -1) : w));
}
const hasAll = (text, ts) => { const f = fold(text); return ts.every((t) => f.includes(t)); };
function matchesQuery(task) {
  const ts = terms();
  if (!ts.length) return true;
  const hay = [task.title, task.description, topic(task.topic_id)?.title, ...task.people.map((id) => person(id)?.name),
    ...S.data.notes.filter((n) => n.task_id === task.id).map((n) => n.body),
    ...taskFiles(task).map((a) => a.name)].join(' ');
  return hasAll(hay, ts);
}
// Escape + <mark> oko pogodaka trenutnog upita.
function hl(text) {
  const src = String(text ?? '').normalize('NFC');
  const ts = terms();
  if (!ts.length || fold(src).length !== src.length) return esc(src);
  const f = fold(src), marks = new Array(src.length).fill(false);
  ts.forEach((t) => { for (let i = f.indexOf(t); i >= 0; i = f.indexOf(t, i + 1)) for (let j = i; j < i + t.length; j++) marks[j] = true; });
  let out = '', open = false;
  for (let i = 0; i < src.length; i++) {
    if (marks[i] !== open) { out += marks[i] ? '<mark>' : '</mark>'; open = marks[i]; }
    out += esc(src[i]);
  }
  return out + (open ? '</mark>' : '');
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null;
function micBtn(targetId) {
  if (!SR) return '';
  return `<button type="button" class="mic" title="Diktiraj (hrvatski)" data-mic="${targetId}">🎤</button>`;
}
function toggleMic(btn) {
  const target = document.getElementById(btn.dataset.mic);
  if (!target) return;
  if (activeRec) { const same = activeRec.btn === btn; activeRec.rec.stop(); if (same) return; }
  const rec = new SR();
  rec.lang = 'hr-HR'; rec.continuous = true; rec.interimResults = true;
  const base = target.value ? target.value.replace(/\s*$/, ' ') : '';
  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript.trim() + ' ';
      else interim += r[0].transcript;
    }
    target.value = (base + finalText + interim).replace(/^\s+/, '');
    target.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onerror = (e) => { if (e.error === 'not-allowed') toast('Dopusti pristup mikrofonu u pregledniku'); };
  rec.onend = () => { btn.classList.remove('rec'); if (activeRec?.rec === rec) activeRec = null; target.value = target.value.trim(); };
  rec.start(); btn.classList.add('rec'); activeRec = { rec, btn };
}

/* Prepoznaj imena ljudi u tekstu (i padeže: Ivan → Ivanu, Ivana…) */
function peopleInText(text) {
  const words = text.toLowerCase().split(/[^\p{L}]+/u).filter(Boolean);
  return S.data.people.filter((p) => {
    if (p.is_me) return words.some((w) => ['ja', 'meni', 'mene', 'sebi'].includes(w));   // „Ja“ samo na točnu riječ
    const first = p.name.toLowerCase().split(/\s+/)[0];
    const stem = first.length > 3 ? first.slice(0, -1) : first;
    return words.some((w) => w === first || (w.startsWith(stem) && w.length <= first.length + 3));
  }).map((p) => p.id);
}

/* ---- Teme ---- */
function topicsView() {
  const { topics, tasks } = S.data;
  if (!topic(S.topicId)) S.topicId = topics.find((t) => !t.archived && !t.parent_id)?.id || topics[0]?.id || null;
  const t = topic(S.topicId);
  // otvori put do odabrane teme
  if (t) topicAncestors(t).forEach((a) => S.collapsed.delete(a.id));
  const openIn = (ids) => tasks.filter((k) => ids.has(k.topic_id) && k.status !== 'done').length;

  const rows = [];
  const walk = (list, depth) => list.forEach((x) => {
    const kids = childTopics(x.id);
    const shut = S.collapsed.has(x.id);
    const n = openIn(topicSubtree(x.id));
    rows.push(`<div class="topic-item ${x.id === S.topicId ? 'on' : ''}" data-act="topic" data-id="${x.id}"
        style="padding-left:${6 + depth * 16}px;${x.archived ? 'opacity:.5' : ''}">
      <span class="twisty" ${kids.length ? `data-act="twisty" data-id="${x.id}" title="${shut ? 'Prikaži' : 'Sakrij'} podteme"` : ''}>${kids.length ? (shut ? '▸' : '▾') : ''}</span>
      <span class="dot" style="background:${esc(x.color)}"></span><span class="grow">${esc(x.title)}</span><span class="count">${n || ''}</span></div>`);
    if (!shut) walk(kids, depth + 1);
  });
  walk(childTopics(null), 0);

  const side = `<div class="panel stack side">
      <button class="primary" data-act="newTopic" style="width:100%">+ Nova tema</button>
      <div>${rows.join('') || '<div class="muted small">Još nema tema.</div>'}</div>
    </div>`;
  if (!t) return `<div class="layout">${side}<div class="panel empty">Napravi prvu temu, npr. „Renovacija ureda“ ili „Sajam 2027“.<br>Unutar nje možeš otvoriti podteme.</div></div>`;

  const sub = topicSubtree(t.id);
  const kids = childTopics(t.id);
  const inScope = (k) => (S.withSub ? sub.has(k.topic_id) : k.topic_id === t.id);
  const tt = tasks.filter((k) => inScope(k) && matchesStatus(k) && matchesQuery(k));
  sortTasks(tt);
  const crumbs = topicAncestors(t).map((a) => `<a href="#" data-act="topic" data-id="${a.id}">${esc(a.title)}</a> › `).join('');
  const cards = kids.map((c) => {
    const ids = topicSubtree(c.id);
    const all = tasks.filter((k) => ids.has(k.topic_id));
    const open = all.filter((k) => k.status !== 'done').length;
    const subN = ids.size - 1;
    return `<button class="subcard" data-act="topic" data-id="${c.id}" style="border-left-color:${esc(c.color)};${c.archived ? 'opacity:.55' : ''}">
      <strong>${esc(c.title)}</strong>
      <span class="muted small">${open} otvorenih / ${all.length}${subN ? ` · ${subN} podtema` : ''}</span></button>`;
  }).join('');

  const mainCol = `<div class="stack">
    <div class="panel stack">
      ${crumbs ? `<div class="small muted crumbs">${crumbs}</div>` : ''}
      <div class="row">
        <span class="dot" style="background:${esc(t.color)};width:14px;height:14px"></span>
        <h2 class="grow">${esc(t.title)}</h2>
        <button class="ghost" data-act="newSubtopic" data-id="${t.id}" title="Nova podtema unutar ove teme">+ Podtema</button>
        <button class="ghost" data-act="saveTemplate" data-id="${t.id}" title="Spremi ovu temu kao predložak za sljedeći put">📋 Predložak</button>
        <button class="ghost" data-act="editTopic" data-id="${t.id}">Uredi</button>
      </div>
      ${t.description ? `<div class="muted">${esc(t.description)}</div>` : ''}
      <div class="row task-files" data-dropzone="topic:${t.id}">
        ${attachList(filesOf('topic', t.id))}
        ${attachBtn(`topic:${t.id}`, '📎 Dokument teme', 'Dokumenti cijele teme (ugovor, plan, ponuda…)')}
      </div>
      ${kids.length ? `<div class="subcards">${cards}</div>` : ''}
      ${newTaskForm(t.id)}
    </div>
    <div class="row">${filtersView()}
      ${sub.size > 1 ? `<label class="row small muted" style="gap:4px"><input type="checkbox" data-act="withSub" style="width:auto" ${S.withSub ? 'checked' : ''}> i zadaci iz podtema</label>` : ''}
      <span class="muted small" style="margin-left:auto">${tt.length} zadataka</span></div>
    <div>${tt.map((k) => taskView(k, { showTopic: S.withSub && k.topic_id !== t.id })).join('') || '<div class="panel empty">Nema zadataka za ovaj filter.</div>'}</div>
  </div>`;
  return `<div class="layout">${side}${mainCol}</div>`;
}

function sortTasks(arr) {
  const pr = { high: 0, normal: 1, low: 2 }, st = { doing: 0, todo: 1, done: 2 };
  arr.sort((a, b) => st[a.status] - st[b.status] || pr[a.priority] - pr[b.priority]
    || (a.due_date || '9999').localeCompare(b.due_date || '9999') || a.id - b.id);
}

/* ========= prilozi (PDF, fotografije, dokumenti) ========= */
const MAX_FILE = 20 * 1024 * 1024;
const filesOf = (kind, id) => S.data.attachments.filter((a) => a[kind + '_id'] === id);
// svi prilozi zadatka: na zadatku i u njegovim bilješkama
const taskFiles = (k) => S.data.attachments.filter((a) => a.task_id === k.id
  || (a.note_id && S.data.notes.some((n) => n.id === a.note_id && n.task_id === k.id)));
const fileUrl = (a, dl = false) => `/api/files?id=${a.id}${dl ? '&dl=1' : ''}`;
const isImage = (a) => /^image\/(png|jpe?g|gif|webp|avif|heic|heif)$/i.test(a.mime || '');
function fileIcon(a) {
  const m = a.mime || '', n = a.name.toLowerCase();
  if (m === 'application/pdf') return '📕';
  if (/word|document|rtf|odt/.test(m) || /\.(docx?|odt|rtf)$/.test(n)) return '📘';
  if (/sheet|excel|csv/.test(m) || /\.(xlsx?|ods|csv)$/.test(n)) return '📗';
  if (/presentation|powerpoint/.test(m) || /\.(pptx?|odp)$/.test(n)) return '📙';
  if (/^audio\//.test(m)) return '🎵';
  if (/^video\//.test(m)) return '🎬';
  if (/zip|compressed|rar|7z/.test(m)) return '🗜️';
  if (/^image\//.test(m)) return '🖼️';
  return '📄';
}
const fmtSize = (b) => (b < 1024 ? `${b} B` : b < 1048576 ? `${Math.round(b / 1024)} kB` : `${(b / 1048576).toFixed(1)} MB`);
// Popis priloga: slike kao sličice, ostalo kao „čip“ s ikonom. small = sažeto (u retku bilješke).
function attachList(list, { small = false, readonly = false } = {}) {
  if (!list.length) return '';
  return `<div class="atts ${small ? 'small' : ''}">${list.map((a) => isImage(a)
    ? `<button type="button" class="att-img" data-act="viewFile" data-id="${a.id}" title="${esc(a.name)} · ${fmtSize(a.size || 0)}">
        <img src="${fileUrl(a)}&t=1" alt="${esc(a.name)}" loading="lazy"></button>`
    : `<span class="att"><a href="${fileUrl(a)}" ${a.mime === 'application/pdf' ? `data-act="viewFile" data-id="${a.id}"` : ''} target="_blank" rel="noopener" title="Otvori">${fileIcon(a)} ${hl(a.name)}</a>
        <span class="muted">${fmtSize(a.size || 0)}</span>
        <a href="${fileUrl(a, true)}" class="muted" title="Preuzmi" download>⬇</a>
        ${readonly ? '' : `<button type="button" class="ghost danger" data-act="delFile" data-id="${a.id}" title="Obriši prilog">✕</button>`}</span>`).join('')}</div>`;
}
// Gumb 📎: na mobitelu nudi fotoaparat, galeriju i datoteke.
const attachBtn = (target, label = '📎', title = 'Dodaj prilog (PDF, fotografija, dokument)') =>
  `<label class="attach-btn ghost" title="${title}">${label}<input type="file" multiple data-upload="${target}" hidden></label>`;

// Velike fotografije s mobitela smanji (najviše 2400 px, JPEG) — brži prijenos, manje mjesta.
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5 * 1024 * 1024) return file;
  try {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 2400 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}
// Sličica (najviše 320 px) za brz prikaz popisa — cijela slika učitava se tek na klik.
async function uploadThumb(id, file) {
  try {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 320 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.75));
    if (blob) await fetch(`/api/files?thumb=${id}`, { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg', 'x-file-name': 'thumb.jpg' } });
  } catch { /* bez sličice prikazuje se cijela slika */ }
}
// target = "task:12" | "note:5" | "topic:3" | "pnote:7"
async function uploadFiles(target, fileList) {
  const [kind, id] = target.split(':');
  const files = [...fileList];
  if (!files.length) return;
  if (S.offline) return toast('📴 Bez interneta — prilozi nisu mogući');
  let ok = 0;
  for (const [i, f0] of files.entries()) {
    const f = await shrinkImage(f0);
    if (f.size > MAX_FILE) { toast(`„${f.name}“ je prevelik (najviše 20 MB)`); continue; }
    toast(`📎 Prenosim ${files.length > 1 ? `${i + 1}/${files.length}: ` : ''}${f.name}…`);
    try {
      const res = await fetch(`/api/files?${kind}=${id}`, {
        method: 'POST', body: f,
        headers: { 'Content-Type': f.type || 'application/octet-stream', 'x-file-name': encodeURIComponent(f.name) },
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || 'Greška ' + res.status);
      S.data.attachments.push(json.attachment); ok++;
      if (/^image\/(jpeg|png|webp)$/.test(f.type)) await uploadThumb(json.attachment.id, f);
    } catch (e) { toast(`Prilog „${f.name}“ nije spremljen: ${e.message}`); }
  }
  render();
  if (ok) toast(ok > 1 ? `📎 Spremljeno ${ok} priloga` : '📎 Prilog spremljen');
}
// 📎 u obrascu nove bilješke: najprije napravi bilješku (tekst iz polja ili nazivi datoteka), onda priloži.
async function uploadToNewNote(form, fileList) {
  const files = [...fileList];
  const body = form.body.value.trim() || '📎 ' + files.map((f) => f.name).join(', ');
  const before = new Set(S.data.notes.map((n) => n.id));
  form.body.value = ''; // prije spremanja, inače ga render() vrati kao nacrt
  await run('addNote', { task_id: Number(form.dataset.task), person_id: Number(form.dataset.person) || null, body });
  const note = S.data.notes.find((n) => !before.has(n.id));
  if (!note) return;
  await uploadFiles(`note:${note.id}`, files);
}

// Stranice PDF-a iscrtane u aplikaciji (pdf.js iz vendor/), najviše 30 stranica.
async function renderPdf(a) {
  const box = $('#pdfview');
  try {
    pdfjsLib ||= await import('/vendor/pdfjs/pdf.min.mjs').then((m) => { m.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs'; return m; });
    const task = pdfjsLib.getDocument({ url: fileUrl(a), wasmUrl: '/vendor/pdfjs/wasm/', isEvalSupported: false, withCredentials: true });
    const doc = await task.promise;
    box.innerHTML = '';
    const width = Math.min(box.clientWidth || 800, 1000);
    for (let i = 1; i <= Math.min(doc.numPages, 30); i++) {
      if (!document.body.contains(box)) break; // dijalog zatvoren
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale: 1 }), dpr = Math.min(2, window.devicePixelRatio || 1);
      const vp = page.getViewport({ scale: (width / base.width) * dpr });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.width = '100%';
      box.appendChild(c);
      await page.render({ canvas: c, canvasContext: c.getContext('2d'), viewport: vp, background: '#ffffff' }).promise;
    }
    if (doc.numPages > 30) box.insertAdjacentHTML('beforeend', `<div class="muted small" style="padding:10px">… još ${doc.numPages - 30} stranica — otvori PDF za cijeli dokument.</div>`);
    task.destroy();
  } catch { box.innerHTML = '<div class="muted small" style="padding:20px">PDF se ne može prikazati ovdje — otvori ga ili preuzmi.</div>'; }
}

/* ---- Kalendar ---- */
const MONTHS = ['siječanj', 'veljača', 'ožujak', 'travanj', 'svibanj', 'lipanj', 'srpanj', 'kolovoz', 'rujan', 'listopad', 'studeni', 'prosinac'];
const WEEKDAYS = ['Pon', 'Uto', 'Sri', 'Čet', 'Pet', 'Sub', 'Ned'];
const WEEKDAYS_LONG = ['ponedjeljak', 'utorak', 'srijeda', 'četvrtak', 'petak', 'subota', 'nedjelja'];
const monday = (d) => addDays(d, -((d.getDay() + 6) % 7));

// Blagdani i neradni dani u Hrvatskoj (Uskrs po gregorijanskom računanju).
const holidayCache = {};
function hrHolidays(y) {
  if (holidayCache[y]) return holidayCache[y];
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = new Date(y, month - 1, day);
  const fixed = { '01-01': 'Nova godina', '01-06': 'Sveta tri kralja', '05-01': 'Praznik rada', '05-30': 'Dan državnosti',
    '06-22': 'Dan antifašističke borbe', '08-05': 'Dan pobjede', '08-15': 'Velika Gospa', '11-01': 'Svi sveti',
    '11-18': 'Dan sjećanja na Vukovar', '12-25': 'Božić', '12-26': 'Sveti Stjepan' };
  const out = {};
  Object.entries(fixed).forEach(([md, n]) => { out[`${y}-${md}`] = n; });
  out[isoDate(easter)] = 'Uskrs'; out[isoDate(addDays(easter, 1))] = 'Uskrsni ponedjeljak'; out[isoDate(addDays(easter, 60))] = 'Tijelovo';
  return (holidayCache[y] = out);
}
const holiday = (iso) => hrHolidays(Number(iso.slice(0, 4)))[iso];

function calTasks() {
  const c = S.cal;
  const scope = c.topic && topic(c.topic) ? topicSubtree(c.topic) : null;
  return S.data.tasks.filter((k) => (c.done || k.status !== 'done')
    && (!c.person || k.people.includes(c.person)) && (!scope || scope.has(k.topic_id)));
}
const initials = (name) => name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
// e = {k, seg: 'start'|'mid'|'end'|null, ghost: bool} ili sam zadatak
function calChip(e, big = false) {
  const { k, seg = null, ghost = false } = e.k ? e : { k: e };
  const t = topic(k.topic_id), col = t?.color || '#6b7385';
  const late = !ghost && k.status !== 'done' && k.due_date < today();
  const ppl = k.people.map(person).filter(Boolean);
  const tip = `${k.title} — ${topicPath(t)}${k.start_date ? ` — ${fmtSpan(k)}` : ''}${ghost ? ' — sljedeće ponavljanje' : ''}${ppl.length ? ' — ' + ppl.map((p) => p.name).join(', ') : ''}`;
  return `<div class="cchip st-${k.status} ${late ? 'late' : ''} ${big ? 'big' : ''} ${seg ? 'seg-' + seg : ''} ${ghost ? 'ghost' : ''}" ${ghost ? '' : 'draggable="true"'} data-act="calTask" data-id="${k.id}"
      style="border-left-color:${esc(col)};background:${esc(col)}${ghost ? '0d' : '1a'}" title="${esc(tip)}">
    <span class="ct">${ghost ? '🔁 ' : seg === 'mid' || seg === 'end' ? '⋯ ' : ''}${k.status === 'done' ? '✓ ' : k.priority === 'high' ? '❗' : ''}${esc(k.title)}${seg === 'start' ? ' →' : ''}</span>
    ${big ? `<span class="cm">${esc(topicPath(t))}${ppl.length ? ' · ' + esc(ppl.map((p) => p.name).join(', ')) : ''}</span>`
      : ppl.length ? `<span class="ci">${ppl.slice(0, 3).map((p) => `<b title="${esc(p.name)}">${esc(initials(p.name))}</b>`).join('')}</span>` : ''}
  </div>`;
}
// Zadaci po danima u rasponu [from, to]: višednevni na svakom danu, ponavljanja kao „duhovi“ unaprijed.
function calEntries(tasks, from, to) {
  const byDay = {};
  const put = (d, e) => { if (d >= from && d <= to) (byDay[d] ||= []).push(e); };
  tasks.forEach((k) => {
    if (!k.due_date) return;
    if (k.start_date && k.start_date < k.due_date) {
      for (let d = k.start_date, i = 0; d <= k.due_date && i < 400; d = isoDate(addDays(parseDate(d), 1)), i++)
        put(d, { k, seg: d === k.start_date ? 'start' : d === k.due_date ? 'end' : 'mid' });
    } else put(k.due_date, { k });
    if (k.repeat && k.status !== 'done') {
      for (let n = 1, d = addPeriod(k.due_date, k.repeat, 1); d <= to && n < 400; d = addPeriod(k.due_date, k.repeat, ++n)) put(d, { k, ghost: true });
    }
  });
  const pr = { high: 0, normal: 1, low: 2 }, st = { doing: 0, todo: 1, done: 2 };
  Object.values(byDay).forEach((list) => list.sort((a, b) => (a.ghost - b.ghost) || (!!b.seg - !!a.seg)
    || st[a.k.status] - st[b.k.status] || pr[a.k.priority] - pr[b.k.priority] || a.k.id - b.k.id));
  return byDay;
}
function calendarView() {
  const c = S.cal;
  const anchor = parseDate(c.anchor || today());
  const tasks = calTasks();
  const week0 = c.mode === 'week' ? monday(anchor) : monday(new Date(anchor.getFullYear(), anchor.getMonth(), 1));
  const from = c.mode === 'list' ? today() : isoDate(week0);
  const to = isoDate(addDays(parseDate(from), c.mode === 'list' ? 60 : 42));
  const byDay = calEntries(tasks, from, to);
  const noDue = tasks.filter((k) => !k.due_date && k.status !== 'done').length;
  const td = today();

  let title, body;
  if (c.mode === 'list') {
    const late = tasks.filter((k) => k.due_date && k.due_date < td && k.status !== 'done');
    sortTasks(late);
    const days = Object.keys(byDay).filter((d) => d >= td).sort().slice(0, 60);
    title = 'Popis rokova';
    body = `<div class="cal-list">
      ${late.length ? `<div class="cl-day late"><div class="cl-h">⚠️ Kasni (${late.length})</div>${late.map((k) => `<div class="row">${calChip(k, true)}<span class="small due late">${fmtDate(k.due_date)}</span></div>`).join('')}</div>` : ''}
      ${days.map((d) => { const dt = parseDate(d); const h = holiday(d);
        return `<div class="cl-day ${d === td ? 'today' : ''}" data-day="${d}"><div class="cl-h">${d === td ? 'Danas · ' : ''}${WEEKDAYS_LONG[(dt.getDay() + 6) % 7]}, ${fmtDate(d)}${h ? ` <span class="hol">${esc(h)}</span>` : ''}</div>
          ${byDay[d].map((e) => calChip(e, true)).join('')}</div>`; }).join('') || '<div class="empty">Nema nadolazećih rokova.</div>'}
    </div>`;
  } else {
    const week = c.mode === 'week';
    const start = week0;
    const n = week ? 7 : Math.ceil(((new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0) - start) / 864e5 + 1) / 7) * 7;
    const max = week ? 99 : Math.max(2, Math.floor((window.innerHeight - 260) / (n / 7) / 24) - 1);
    title = week ? `${fmtDate(isoDate(start))} – ${fmtDate(isoDate(addDays(start, 6)))}` : `${MONTHS[anchor.getMonth()]} ${anchor.getFullYear()}.`;
    const cells = [];
    for (let i = 0; i < n; i++) {
      const dt = addDays(start, i), d = isoDate(dt), list = byDay[d] || [], h = holiday(d);
      const other = !week && dt.getMonth() !== anchor.getMonth();
      cells.push(`<div class="cday ${other ? 'other' : ''} ${d === td ? 'today' : ''} ${i % 7 >= 5 || h ? 'weekend' : ''}" data-day="${d}">
        <div class="cd-h"><span class="cd-n">${week ? WEEKDAYS[i] + ' ' : ''}${dt.getDate()}.</span>${h ? `<span class="hol" title="${esc(h)}">${esc(h)}</span>` : ''}
          <button class="ghost cd-add" data-act="calNew" data-day="${d}" title="Novi zadatak s rokom ${fmtDate(d)}">+</button></div>
        ${list.slice(0, list.length > max ? max - 1 : max).map((e) => calChip(e, week)).join('')}
        ${list.length > max ? `<button class="ghost small cd-more" data-act="calDay" data-day="${d}">+${list.length - max + 1} više</button>` : ''}
      </div>`);

function netElements() {
  const n = S.net, els = [];
  const scope = n.topic && topic(n.topic) ? topicSubtree(n.topic) : null;
  const topics = S.data.topics.filter((t) => !scope || scope.has(t.id));
  const tids = new Set(topics.map((t) => t.id));
  topics.forEach((t) => {
    const size = 28 + Math.min(40, (topicSubtree(t.id).size - 1) * 6 + S.data.tasks.filter((k) => k.topic_id === t.id).length * 2);
    els.push({ data: { id: 't' + t.id, kind: 'topic', ref: t.id, label: t.title, color: t.color || '#4f6bed', size, level: 3 } });
    if (t.parent_id && tids.has(t.parent_id)) els.push({ data: { id: `e-t${t.parent_id}-t${t.id}`, source: 't' + t.parent_id, target: 't' + t.id, kind: 'sub' } });
  });
  if (!n.tasks) return els;
  const tasks = S.data.tasks.filter((k) => tids.has(k.topic_id) && (n.done || k.status !== 'done'));
  const pids = new Set();
  tasks.forEach((k) => {
    const late = k.due_date && k.status !== 'done' && k.due_date < today();
    const label = k.title.length > 32 ? k.title.slice(0, 30) + '…' : k.title;
    els.push({ data: { id: 'k' + k.id, kind: 'task', ref: k.id, label, status: k.status, late: late ? 1 : 0, level: 2 } });
    els.push({ data: { id: `e-t${k.topic_id}-k${k.id}`, source: 't' + k.topic_id, target: 'k' + k.id, kind: 'has' } });
    if (n.people) k.people.forEach((pid) => { pids.add(pid); els.push({ data: { id: `e-k${k.id}-p${pid}`, source: 'k' + k.id, target: 'p' + pid, kind: 'who' } }); });
    if (n.notes) S.data.notes.filter((x) => x.task_id === k.id).forEach((x) => {
      els.push({ data: { id: 'n' + x.id, kind: 'note', ref: x.id, label: x.body.length > 26 ? x.body.slice(0, 24) + '…' : x.body, level: 1 } });
      els.push({ data: { id: `e-n${x.id}`, source: 'k' + k.id, target: 'n' + x.id, kind: 'note' } });
      if (n.people && x.person_id && k.people.includes(x.person_id)) els.push({ data: { id: `e-n${x.id}-p`, source: 'n' + x.id, target: 'p' + x.person_id, kind: 'notefor' } });
    });
  });
  S.data.people.filter((p) => pids.has(p.id)).forEach((p) => els.push({ data: { id: 'p' + p.id, kind: 'person', ref: p.id, label: p.name, level: 0 } }));
  return els;
}

async function drawNetwork() {
  const el = document.getElementById('net');
  if (!el) return;
  let lib;
  try { lib = await loadCytoscape(); } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!document.body.contains(el)) return;
  const els = netElements();
  if (!els.length) { el.innerHTML = '<div class="empty">Još nema tema. Napravi ih u kartici „Teme“.</div>'; return; }
  const key = JSON.stringify([S.net, els.map((x) => x.data.id)]);
  const cached = S.netCache?.key === key ? S.netCache.pos : null;
  cy?.destroy();
  cy = lib({ container: el, elements: els, style: netStyle(), wheelSensitivity: 0.25, minZoom: 0.1, maxZoom: 3 });
  const roots = cy.nodes('[kind="topic"]').filter((nd) => nd.incomers('edge[kind="sub"]').empty());
  const layout = cached ? { name: 'preset', positions: (nd) => cached[nd.id()] }
    : S.net.layout === 'breadthfirst' ? { name: 'breadthfirst', directed: true, roots, spacingFactor: 1.1, animate: false }
    : S.net.layout === 'concentric' ? { name: 'concentric', concentric: (nd) => nd.data('level'), levelWidth: () => 1, minNodeSpacing: 18, animate: false }
    : { name: 'cose', animate: false, nodeRepulsion: () => 26000, nodeOverlap: 20, idealEdgeLength: (ed) => (ed.data('kind') === 'sub' ? 150 : 85),
        componentSpacing: 120, gravity: 0.35, numIter: 2500, randomize: true, padding: 30 };
  cy.layout(layout).run();
  if (cached && S.netCache.view) cy.viewport(S.netCache.view); else cy.fit(undefined, 30);
  const remember = () => {
    const pos = {}; cy.nodes().forEach((nd) => { pos[nd.id()] = { ...nd.position() }; });
    S.netCache = { key, pos, view: { zoom: cy.zoom(), pan: { ...cy.pan() } } };
  };
  remember();
  cy.on('dragfree viewport', remember);
  cy.on('tap', 'node', (e) => netSelect(e.target));
  cy.on('tap', (e) => { if (e.target === cy) { cy.elements().removeClass('faded'); $('#net-info').hidden = true; } });
}

  box.innerHTML = html + `<button class="ghost net-x" data-act="netClose" title="Zatvori">✕</button>`;
  box.hidden = false;

function boardView() {
  const b = S.board;
  const scope = b.topic && topic(b.topic) ? topicSubtree(b.topic) : null;
  const tasks = S.data.tasks.filter((k) => (!scope || scope.has(k.topic_id)) && (!b.person || k.people.includes(b.person)) && matchesQuery(k));

}

const b64ToBytes = (b64) => { const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, (c) => c.charCodeAt(0)); };
async function pushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return isIOS() && !isStandalone() ? 'ios-install' : 'unsupported';
  const reg = await navigator.serviceWorker.ready;
  return (await reg.pushManager.getSubscription()) ? 'on' : Notification.permission === 'denied' ? 'denied' : 'off';
}
async function updatePushBtn() {
  const b = $('#push-btn'); if (!b) return;
  const st = await pushState().catch(() => 'unsupported');
  b.dataset.state = st;
  b.textContent = { on: '🔕 Isključi obavijesti na ovom uređaju', off: '🔔 Uključi obavijesti (jutarnji sažetak, javljanja)',
    denied: '🔔 Obavijesti su blokirane u pregledniku', 'ios-install': '🔔 Obavijesti: najprije dodaj aplikaciju na početni zaslon',
    unsupported: '🔔 Ovaj preglednik ne podržava obavijesti' }[st];
  b.disabled = st === 'unsupported';
}
async function pushToggle(btn) {
  const st = btn.dataset.state;
  if (st === 'ios-install') return toast('Na iPhoneu: Safari → Dijeli → Dodaj na početni zaslon, pa otvori aplikaciju s ikone i uključi obavijesti.');
  if (st === 'denied') return toast('Obavijesti su blokirane — dopusti ih u postavkama preglednika za ovu stranicu.');
  const reg = await navigator.serviceWorker.ready;
  if (st === 'on') {
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'unsubscribe', endpoint: sub.endpoint }) }); await sub.unsubscribe(); }
    toast('🔕 Obavijesti isključene'); return updatePushBtn();
  }
  try {
    const cfg = await (await fetch('/api/push')).json();
    if (!cfg.publicKey) throw new Error(cfg.error || 'Obavijesti nisu podešene');
    if (await Notification.requestPermission() !== 'granted') { toast('Bez dopuštenja nema obavijesti'); return updatePushBtn(); }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(cfg.publicKey) });
    const r = await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'subscribe', sub: sub.toJSON() }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Pretplata nije spremljena');
    await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'test' }) });
    toast('🔔 Uključeno — upravo stiže probna obavijest');
  } catch (e) { toast(e.message); }
  updatePushBtn();
}

/* ---- Statistika i izvoz ---- */
const daysAgo = (n) => Date.now() - n * 864e5;
function statsView() {
  const { tasks, people } = S.data, td = today(), from = daysAgo(S.stats.days);
  const doneIn = tasks.filter((k) => k.status === 'done' && k.completed_at && new Date(k.completed_at) >= from);
  const created = tasks.filter((k) => new Date(k.created_at) >= from);
  const withDue = doneIn.filter((k) => k.due_date);
  const onTime = withDue.filter((k) => isoDate(new Date(k.completed_at)) <= k.due_date);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);
  const avgDays = doneIn.length ? (doneIn.reduce((s, k) => s + (new Date(k.completed_at) - new Date(k.created_at)) / 864e5, 0) / doneIn.length) : null;
  const lateNow = tasks.filter((k) => k.status !== 'done' && k.due_date && k.due_date < td);
  // tjedni: zadnjih 12 tjedana (ponedjeljak)
  const weeks = [...Array(12)].map((_, i) => { const m = addDays(monday(new Date()), -7 * (11 - i)); return { start: m, end: addDays(m, 7), done: 0, made: 0 }; });
  tasks.forEach((k) => {
    const c = new Date(k.created_at), d = k.completed_at && new Date(k.completed_at);
    weeks.forEach((w) => { if (c >= w.start && c < w.end) w.made++; if (d && k.status === 'done' && d >= w.start && d < w.end) w.done++; });
  });
  const max = Math.max(1, ...weeks.map((w) => Math.max(w.done, w.made)));
  const perPerson = people.map((p) => {
    const mine = tasks.filter((k) => k.people.includes(p.id));
    const d = mine.filter((k) => doneIn.includes(k)), dd = d.filter((k) => k.due_date);
    return { p, open: mine.filter((k) => k.status !== 'done').length, done: d.length,
      onTime: pct(dd.filter((k) => isoDate(new Date(k.completed_at)) <= k.due_date).length, dd.length),
      late: mine.filter((k) => lateNow.includes(k)).length };
  }).filter((x) => x.open || x.done).sort((a, b) => b.done - a.done || b.open - a.open);
  const roots = childTopics(null).map((t) => { const ids = topicSubtree(t.id), all = tasks.filter((k) => ids.has(k.topic_id));
    return { t, all: all.length, done: all.filter((k) => k.status === 'done').length, late: all.filter((k) => lateNow.includes(k)).length }; }).filter((x) => x.all);

    <div class="ov-grid">

function exportTasks() {
  const scope = $('#ex-scope')?.value || 'all', withDone = $('#ex-done')?.checked !== false;
  let list = S.data.tasks.filter((k) => withDone || k.status !== 'done');
  let title = 'Svi zadaci';
  if (scope[0] === 't') { const ids = topicSubtree(Number(scope.slice(1))); list = list.filter((k) => ids.has(k.topic_id)); title = topicPath(topic(Number(scope.slice(1)))); }
  if (scope[0] === 'p') { const pid = Number(scope.slice(1)); list = list.filter((k) => k.people.includes(pid)); title = 'Zadaci: ' + person(pid)?.name; }
  sortTasks(list);
  return { list, title };
}
function downloadCsv() {
  const { list, title } = exportTasks();
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Tema', 'Zadatak', 'Opis', 'Osobe', 'Status', 'Prioritet', 'Početak', 'Rok', 'Završeno', 'Ponavljanje', 'Koraci', 'Bilješke']];
  list.forEach((k) => {
    const st = stepsOf(k);
    rows.push([topicPath(topic(k.topic_id)), k.title, k.description, k.people.map((i) => outName(person(i))).filter(Boolean).join(', '),
      STATUS[k.status], PRIO[k.priority], fmtDate(k.start_date), fmtDate(k.due_date), k.completed_at ? fmtDate(isoDate(new Date(k.completed_at))) : '',
      k.repeat ? REPEAT[k.repeat] : '', st.length ? `${st.filter((x) => x.done).length}/${st.length}: ` + st.map((x) => (x.done ? '✓ ' : '') + x.title).join('; ') : '',
      S.data.notes.filter((n) => n.task_id === k.id).map((n) => (n.person_id ? outName(person(n.person_id)) + ': ' : '') + n.body).join(' | ')]);
  });
  // Excel s hrvatskim postavkama očekuje ; i UTF-8 BOM (za čćšžđ)
  const csv = '﻿' + rows.map((r) => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `delegator-${title.replace(/[^\p{L}\p{N}]+/gu, '-').toLowerCase()}-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`📊 Preuzeto ${list.length} zadataka`);
}
function printReport() {
  const { list, title } = exportTasks();
  const w = window.open('', '_blank');
  if (!w) return toast('Preglednik je blokirao novi prozor — dopusti skočne prozore za ovu stranicu');
  const groups = {};
  list.forEach((k) => (groups[topicPath(topic(k.topic_id))] ||= []).push(k));
  const td = today();
  w.document.write(`<!doctype html><html lang="hr"><head><meta charset="utf-8"><title>${esc(title)} — Delegator</title><style>
    body{font:12px/1.45 system-ui,sans-serif;color:#1d2330;margin:28px} h1{font-size:20px;margin:0} .sub{color:#6b7385;margin:4px 0 18px}
    h2{font-size:14px;margin:18px 0 6px;border-bottom:2px solid #4f6bed;padding-bottom:3px} table{width:100%;border-collapse:collapse}
    td,th{border-bottom:1px solid #e3e6ec;padding:5px 6px;text-align:left;vertical-align:top} th{font-size:11px;color:#6b7385;text-transform:uppercase}
    .late{color:#d64545;font-weight:600} .done{color:#2f9e6b} .n{color:#6b7385;font-size:11px} @media print{body{margin:0}}</style></head><body>
    <h1>${esc(title)}</h1><div class="sub">Delegator · ${esc(S.user.name)} · ${fmtDate(td)} · ${list.length} zadataka</div>
    ${Object.entries(groups).map(([g, ks]) => `<h2>${esc(g)}</h2><table><thead><tr><th style="width:38%">Zadatak</th><th>Osobe</th><th>Status</th><th>Rok</th></tr></thead><tbody>
      ${ks.map((k) => { const late = k.status !== 'done' && k.due_date && k.due_date < td; const st = stepsOf(k);
        const notes = S.data.notes.filter((n) => n.task_id === k.id);
        return `<tr><td><b>${esc(k.title)}</b>${k.priority === 'high' ? ' ❗' : ''}${k.description ? `<div class="n">${esc(k.description)}</div>` : ''}
          ${st.length ? `<div class="n">Koraci: ${st.map((x) => (x.done ? '☑ ' : '☐ ') + esc(x.title)).join(' · ')}</div>` : ''}
          ${notes.length ? `<div class="n">${notes.map((n) => '– ' + (n.person_id ? esc(outName(person(n.person_id))) + ': ' : '') + esc(n.body)).join('<br>')}</div>` : ''}</td>
          <td>${k.people.map((i) => esc(outName(person(i)) || '')).join(', ')}</td>
          <td class="${k.status === 'done' ? 'done' : ''}">${STATUS[k.status]}</td><td class="${late ? 'late' : ''}">${fmtSpan(k)}${late ? ' (kasni)' : ''}</td></tr>`; }).join('')}
      </tbody></table>`).join('') || '<p>Nema zadataka za odabrani opseg.</p>'}
    <script>setTimeout(() => print(), 300)<\/script></body></html>`);
  w.document.close();
}

// Fotografija za AI: smanjena na 1600 px (dovoljno za čitanje teksta), kao data URL.
async function imageForAI(file) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82);
}
// PDF za AI (u pregledniku, pdf.js iz vendor/ — učitava se tek kad zatreba):
// ako PDF ima tekst, šalje se tekst; ako je skeniran, prve 3 stranice kao slike.
let pdfjsLib = null;
async function pdfForAI(file) {
  pdfjsLib ||= await import('/vendor/pdfjs/pdf.min.mjs').then((m) => {
    m.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs'; return m;
  });
  const task = pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), wasmUrl: '/vendor/pdfjs/wasm/', isEvalSupported: false });
  let doc;
  try {
    doc = await task.promise;
  } catch (e) {
    task.destroy();
    throw new Error(e?.name === 'PasswordException' ? 'PDF je zaštićen lozinkom — otvori ga i spremi bez lozinke' : 'PDF se ne može pročitati');
  }
  let text = '';
  for (let i = 1; i <= Math.min(doc.numPages, 8) && text.length < 15000; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    text += tc.items.map((it) => it.str + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n';
  }
  if (text.replace(/\s/g, '').length >= 80) { task.destroy(); return { doc_text: text.trim(), pages: doc.numPages }; }
  const images = [];
  for (let i = 1; i <= Math.min(doc.numPages, 3); i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: Math.min(2.5, 1600 / Math.max(base.width, base.height)) });
    const c = document.createElement('canvas');
    c.width = Math.round(viewport.width); c.height = Math.round(viewport.height);
    await page.render({ canvas: c, canvasContext: c.getContext('2d'), viewport, background: '#ffffff' }).promise;
    images.push(c.toDataURL('image/jpeg', 0.8));
  }
  task.destroy(); // u pdf.js v6 zatvara se zadatak učitavanja, ne dokument
  return { images, pages: images.length };
}
async function parseText(text, extra = {}) {
  const res = await fetch('/api/parse', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, ...extra, topic_hint: S.view === 'topics' ? topic(S.topicId)?.title : null }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || 'Greška ' + res.status);
  return json;
}

// Zapisnik: više prijedloga odjednom — svaki se može urediti, isključiti i sve se sprema jednim klikom.
function quickStepMulti(text, list) {
  const dlg = $('#dlg');
  const card = (p, i) => {
    const chips = S.data.people.map((x) => `<button type="button" class="chip ${p.people.includes(x.id) ? 'on' : ''}" data-act="chip" data-id="${x.id}">${esc(pLabel(x))}</button>`).join('')
      + p.new_people.map((n) => `<button type="button" class="chip new on" data-act="chip" data-new="${esc(n)}" title="Nova osoba">+ ${esc(n)}</button>`).join('');
    return `<div class="mcard" data-i="${i}">
      <label class="row" style="gap:8px"><input type="checkbox" class="m-on" checked style="width:auto"><input class="m-title" value="${esc(p.title)}" style="flex:1;font-weight:600"></label>
      <div class="row">
        <select class="m-topic" style="flex:1;width:auto">${p.new_topic ? `<option value="new" selected>➕ Nova tema: ${esc(p.new_topic)}</option>` : ''}${topicOptions(p.topic_id || (!p.new_topic && S.topicId), { hideArchived: true })}</select>
        <select class="m-prio" style="width:auto">${Object.entries(PRIO).map(([v, l]) => `<option value="${v}" ${v === p.priority ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <input type="date" class="m-due" value="${p.due_date || ''}" style="width:auto">
      </div>
      <div class="chips" data-chips="people">${chips}</div>
      ${p.notes.length || p.steps?.length ? `<div class="small muted">${p.notes.map((n) => `📝 ${esc(n.body)}`).join('<br>')}${p.steps?.length ? `<br>☑ ${p.steps.map(esc).join(' · ')}` : ''}</div>` : ''}
    </div>`;
  };
  dlg.innerHTML = `<form class="stack" data-qa="multi">
    <h2>📋 ${list.length} zadataka iz zapisnika</h2>
    ${text ? `<div class="muted small">„${esc(text.slice(0, 200))}${text.length > 200 ? '…' : ''}“</div>` : ''}
    <div class="stack mlist">${list.map(card).join('')}</div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" data-qa-back>← Natrag</button>
      <button class="primary" id="qa-save">Spremi odabrane</button>
    </div></form>`;
  $('[data-qa-back]', dlg).onclick = () => quickStep1(text, true);
  $('form', dlg).onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#qa-save'); btn.disabled = true;
    const keep = qaPhoto?.file;
    let saved = 0, firstTask = null, firstTopic = null;
    for (const el of dlg.querySelectorAll('.mcard')) {
      if (!el.querySelector('.m-on').checked) continue;
      const p = list[Number(el.dataset.i)];
      btn.innerHTML = `<span class="spinner"></span> Spremam ${saved + 1}…`;
      const on = [...el.querySelectorAll('[data-chips] .chip.on')];
      // osobe/teme koje je napravio prethodni zadatak iz ovog zapisnika više nisu „nove“
      const byName = (n) => S.data.people.find((x) => x.name.toLowerCase() === n.toLowerCase());
      const people = on.filter((c) => !c.dataset.new).map((c) => Number(c.dataset.id))
        .concat(on.filter((c) => c.dataset.new && byName(c.dataset.new)).map((c) => byName(c.dataset.new).id));
      const newPeople = on.filter((c) => c.dataset.new && !byName(c.dataset.new)).map((c) => c.dataset.new);
      const tsel = el.querySelector('.m-topic').value;
      const existingNew = tsel === 'new' && S.data.topics.find((x) => x.title.toLowerCase() === String(p.new_topic).toLowerCase());
      const notes = p.notes.map((n) => {
        if (n.person_id || !n.person_name) return n;
        const x = byName(n.person_name); return x ? { ...n, person_id: x.id } : newPeople.includes(n.person_name) ? n : { ...n, person_name: null };
      });
      const data = await api({ op: 'quickAdd',
        topic_id: tsel === 'new' ? existingNew?.id || null : Number(tsel), new_topic: tsel === 'new' && !existingNew ? p.new_topic : null,
        title: el.querySelector('.m-title').value, description: p.description, priority: el.querySelector('.m-prio').value,
        due_date: el.querySelector('.m-due').value, people, new_people: newPeople, notes, steps: p.steps || [] }).catch(() => null);
      if (!data?.result) continue;
      saved++; firstTask ||= data.result.task_id; firstTopic ||= data.result.topic_id;
    }
    dlg.close(); setQaPhoto(null);
    if (keep && firstTask) uploadFiles(`task:${firstTask}`, [keep]);
    if (firstTopic) { S.view = 'topics'; S.topicId = firstTopic; S.statusFilter = 'open'; save(); render(); }
    toast(`📋 Spremljeno ${saved} zadataka`);
  };
}
