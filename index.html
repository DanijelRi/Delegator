<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delegator — teme, zadaci, ljudi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #4f6bed; --accent-soft: #eef1fe; --danger: #d64545; --ok: #2f9e6b; --warn: #d98b1a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
  button:hover { border-color: #c9ceda; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
  button.ghost:hover { color: var(--ink); background: #eceef3; }
  button.danger:hover { color: var(--danger); }
  input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; width: 100%; }
  textarea { resize: vertical; min-height: 38px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
           display: flex; gap: 12px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  nav { display: flex; gap: 4px; }
  nav button { border-color: transparent; }
  nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  header .search { margin-left: auto; max-width: 260px; }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 96px; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } header .search { max-width: none; width: 100%; order: 3; } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .topic-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .topic-item:hover { background: #f1f3f6; }
  .topic-item.on { background: var(--accent-soft); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  h2 { font-size: 20px; margin: 0; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .stack > * + * { margin-top: 10px; }

  .task { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .task + .task { margin-top: 8px; }
  .task-head { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; cursor: pointer; }
  .task.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-title { font-weight: 600; }
  .task-body { border-top: 1px solid var(--line); padding: 12px; }
  .status { flex: none; border-radius: 999px; font-size: 12px; padding: 2px 10px; border: 1px solid transparent; white-space: nowrap; }
  .st-todo { background: #eef0f4; color: #4a5266; }
  .st-doing { background: #fff3e0; color: #a3650c; }
  .st-done { background: #e5f6ee; color: #1f7a50; }
  .prio-high { color: var(--danger); font-weight: 600; }
  .prio-low { color: var(--muted); }
  .due.late { color: var(--danger); font-weight: 600; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border-radius: 999px; padding: 3px 10px; font-size: 13px; border: 1px solid var(--line); background: #fff; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.static { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  .notes-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fafbfc; }
  .notes-block + .notes-block { margin-top: 8px; }
  .note { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .note:last-of-type { border-bottom: 0; }
  .note-body { white-space: pre-wrap; flex: 1; }
  .note-time { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .with-mic { position: relative; display: flex; gap: 6px; align-items: flex-start; }
  .mic { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 8px; font-size: 17px; }
  .mic.rec { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .65; } }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
           padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(520px, 94vw); }
  dialog::backdrop { background: rgba(20, 24, 35, .35); }
  .fab { position: fixed; right: 18px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; font-size: 24px;
         background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(79,107,237,.4); z-index: 6; }
  .qa-text { font-size: 17px; min-height: 110px; }
  .qa-note { display: flex; gap: 6px; align-items: flex-start; }
  .qa-note .lbl { flex: none; width: 110px; font-size: 13px; color: var(--muted); padding-top: 9px; }
  .chip.new { border-style: dashed; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login { max-width: 360px; margin: 10vh auto; }
  mark { background: #ffe58a; color: inherit; border-radius: 3px; padding: 0 1px; }
  .hits { margin: -4px 0 8px; padding: 6px 12px 8px 24px; border: 1px solid var(--line); border-top: 0;
          border-radius: 0 0 var(--radius) var(--radius); background: #fafbfc; }
  .hits > * + * { margin-top: 4px; }
  a { color: var(--accent); }

  /* stablo tema */
  .side { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
  .twisty { width: 14px; flex: none; color: var(--muted); font-size: 11px; text-align: center; }
  .twisty[data-act]:hover { color: var(--ink); }
  .crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--accent); }
  .subcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .subcard { text-align: left; display: flex; flex-direction: column; gap: 2px; border-left: 4px solid; padding: 8px 10px; background: #fafbfc; }

  /* kalendar */
  main:has(.cal), main:has(.net-wrap) { max-width: none; padding-bottom: 24px; }
  .cal { display: flex; flex-direction: column; gap: 10px; }
  .cal-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .cal-title { font-size: 22px; min-width: 180px; text-transform: capitalize; }
  .cal-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(118px, 1fr));
              gap: 4px; min-height: max(560px, calc(100vh - 215px)); }
  .cal-grid.week { grid-template-rows: 1fr; }
  .cday { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cday.weekend { background: #f8f9fb; } .cday.other { opacity: .45; }
  .cday.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cday.drop, .cl-day.drop { background: var(--accent-soft); border-color: var(--accent); }
  .cd-h { display: flex; align-items: center; gap: 4px; font-size: 12px; min-height: 20px; }
  .cd-n { font-weight: 600; } .cday.today .cd-n { color: var(--accent); }
  .hol { font-size: 10px; color: var(--danger); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cd-add { margin-left: auto; padding: 0 6px; line-height: 18px; opacity: 0; } .cday:hover .cd-add { opacity: 1; }
  .cd-more { padding: 0 4px; text-align: left; color: var(--accent); }
  .cchip { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 5px; border-left: 3px solid; border-radius: 4px; cursor: pointer; min-width: 0; }
  .cchip:hover { filter: brightness(.95); }
  .cchip .ct { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cchip .ci { display: flex; gap: 1px; flex: none; }
  .cchip .ci b { font-size: 9px; background: #fff; border-radius: 3px; padding: 0 2px; color: var(--muted); font-weight: 600; }
  .cchip.st-done .ct { text-decoration: line-through; color: var(--muted); }
  .cchip.late .ct { color: var(--danger); font-weight: 600; }
  .cchip.big { flex-direction: column; align-items: stretch; padding: 5px 8px; font-size: 13px; }
  .cchip.big .ct { white-space: normal; } .cchip .cm { font-size: 11px; color: var(--muted); }
  .cal-list { display: flex; flex-direction: column; gap: 8px; max-width: 900px; }
  .cl-day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
  .cl-day.today { border-color: var(--accent); } .cl-day.late { border-color: #f0c3c3; }
  .cl-h { font-weight: 600; font-size: 14px; } .cl-day .row .cchip { flex: 1; }
  .cal-foot { text-align: center; }
  @media (max-width: 760px) {
    .cal-grid { height: auto; grid-template-rows: repeat(var(--rows), minmax(84px, auto)); gap: 2px; }
    .cal-grid.week { grid-template-columns: 1fr; grid-template-rows: none; }
    .cchip .ci { display: none; } .cday { padding: 2px; } .cchip { font-size: 10px; padding: 1px 3px; }
    .cd-add { opacity: 1; }
  }

  /* mreža */
  .net-wrap { display: flex; flex-direction: column; gap: 10px; }
  .net-bar { gap: 12px; }
  .net-stage { position: relative; height: calc(100vh - 190px); min-height: 480px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  #net { position: absolute; inset: 0; }
  #net-info { position: absolute; top: 10px; right: 10px; width: min(300px, calc(100% - 20px)); box-shadow: 0 6px 20px rgba(20,24,35,.12); display: flex; flex-direction: column; gap: 6px; padding-right: 34px; }
  #net-info[hidden] { display: none; }
  .net-x { position: absolute; top: 6px; right: 6px; }
  .net-help { position: absolute; left: 10px; bottom: 8px; pointer-events: none; }
  .net-legend { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .lg { display: inline-block; width: 10px; height: 10px; margin-left: 6px; }
  .lg.t { background: var(--accent); border-radius: 50%; } .lg.k { background: #9aa3b5; border-radius: 2px; }
  .lg.p { background: #8e5bd6; transform: rotate(45deg); } .lg.n { background: #c3c8d4; }
  .colors { display: flex; gap: 6px; }
  .colors label { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .colors input { display: none; }
  .colors input:checked + label { border-color: var(--ink); }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
/* ========= stanje ========= */
const S = {
  data: { people: [], topics: [], tasks: [], notes: [] },
  view: localStorage.getItem('view') || 'topics',   // topics | people | person
  topicId: Number(localStorage.getItem('topicId')) || null,
  personId: Number(localStorage.getItem('personId')) || null,
  open: new Set(),                                   // otvoreni zadaci
  statusFilter: 'open',                              // all | open | done
  q: '',
  loaded: false,
  needLogin: false,
  user: null,                                        // prijavljeni korisnik {id, name, email, is_admin}
  auth: { mode: 'login' },                           // login | setup | signup | reset
  admin: null,                                       // podaci za karticu „Korisnici“
  collapsed: new Set(JSON.parse(localStorage.getItem('collapsed') || '[]')), // zatvorene grane stabla tema
  withSub: localStorage.getItem('withSub') !== '0',  // u temi prikaži i zadatke iz podtema
  cal: { mode: matchMedia('(max-width: 760px)').matches ? 'list' : 'month', anchor: null, person: 0, topic: 0, done: true,
         ...JSON.parse(localStorage.getItem('cal') || '{}') },   // kalendar
  net: { tasks: true, done: false, people: true, notes: false, layout: 'cose', topic: 0,
         ...JSON.parse(localStorage.getItem('net') || '{}') },   // mreža
};
const COLORS = ['#4f6bed', '#2f9e6b', '#d98b1a', '#d64545', '#8e5bd6', '#1f9bb3', '#6b7385'];
const STATUS = { todo: 'Za napraviti', doing: 'U tijeku', done: 'Gotovo' };
const NEXT_STATUS = { todo: 'doing', doing: 'done', done: 'todo' };
const PRIO = { low: 'Nizak', normal: 'Normalan', high: 'Visok' };

/* ========= API ========= */
async function api(body) {
  const res = await fetch('/api/data', {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { S.needLogin = true; S.auth = { mode: 'login' }; render(); throw new Error('login'); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) { toast('Greška: ' + (json.error || res.status)); throw new Error(json.error); }
  S.user = json.user; delete json.user;
  S.data = json; S.loaded = true; S.needLogin = false;
  render();
  return json;
}
const run = (op, payload = {}) => api({ op, ...payload }).catch(() => {});

// Prijava, registracija i administracija (/api/auth). Baca grešku s porukom za korisnika.
async function authOp(op, payload = {}) {
  const res = await fetch('/api/auth', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op, ...payload }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || 'Greška ' + res.status);
  return json;
}

/* ========= pomoćne ========= */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const person = (id) => S.data.people.find((p) => p.id === id);
const topic = (id) => S.data.topics.find((t) => t.id === id);

/* ---- stablo tema (podteme bilo koje dubine) ---- */
const childTopics = (id) => S.data.topics.filter((t) => (t.parent_id || null) === (id || null) || (!id && t.parent_id && !topic(t.parent_id)));
function topicAncestors(t) {            // od korijena do roditelja
  const out = []; let p = t && topic(t.parent_id);
  while (p && out.length < 50 && !out.includes(p)) { out.unshift(p); p = topic(p.parent_id); }
  return out;
}
const topicPath = (t) => t ? [...topicAncestors(t), t].map((x) => x.title).join(' › ') : '';
function topicSubtree(id) {             // id teme + sve podteme
  const ids = new Set([id]);
  for (let added = true; added;) {
    added = false;
    S.data.topics.forEach((t) => { if (t.parent_id && ids.has(t.parent_id) && !ids.has(t.id)) { ids.add(t.id); added = true; } });
  }
  return ids;
}
function topicTree() {                  // [{t, depth}] redom kao u stablu
  const out = [], seen = new Set();
  const walk = (list, depth) => list.forEach((t) => {
    if (seen.has(t.id)) return; seen.add(t.id);
    out.push({ t, depth }); walk(childTopics(t.id), depth + 1);
  });
  walk(childTopics(null), 0);
  S.data.topics.forEach((t) => { if (!seen.has(t.id)) out.push({ t, depth: 0 }); }); // sigurnosna mreža
  return out;
}
// <option> popis tema s uvlakom; exclude = id-evi koje ne nudimo (npr. tema sama i njene podteme)
const topicOptions = (selected, { exclude = new Set(), hideArchived = false } = {}) => topicTree()
  .filter(({ t }) => !exclude.has(t.id) && (!hideArchived || !t.archived || t.id === selected))
  .map(({ t, depth }) => `<option value="${t.id}" ${t.id === selected ? 'selected' : ''}>${'\u2003'.repeat(depth)}${depth ? '└ ' : ''}${esc(t.title)}</option>`).join('');
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const today = () => isoDate(new Date());
const fmtDate = (d) => d ? d.split('-').reverse().join('.') + '.' : '';
const fmtTime = (ts) => new Date(ts).toLocaleString('hr-HR', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function save() {
  localStorage.setItem('view', S.view);
  localStorage.setItem('collapsed', JSON.stringify([...S.collapsed]));
  localStorage.setItem('withSub', S.withSub ? '1' : '0');
  localStorage.setItem('cal', JSON.stringify({ ...S.cal, anchor: null }));
  localStorage.setItem('net', JSON.stringify(S.net));
  if (S.topicId) localStorage.setItem('topicId', S.topicId);
  if (S.personId) localStorage.setItem('personId', S.personId);
}
/* ========= pretraga ========= */
// Bez razlike velikih/malih slova i kvačica: „Štand“ = „stand“, „Đuro“ = „duro“.
// Duljina teksta se ne mijenja, pa se pozicije pogodaka mogu označiti u izvornom tekstu.
const fold = (s) => String(s ?? '').normalize('NFC').toLowerCase()
  .replace(/[čćšžđ]/g, (c) => ({ č: 'c', ć: 'c', š: 's', ž: 'z', đ: 'd' }[c]))
  .normalize('NFD').replace(/\p{M}/gu, (m) => '');
// Riječi upita; duže riječi bez zadnjeg slova da se nađu i drugi padeži (Marko → Marku, štand → štandu).
function terms() {
  return fold(S.q).split(/[^\p{L}\p{N}]+/u).filter(Boolean).map((w) => (w.length >= 5 ? w.slice(0, -1) : w));
}
const hasAll = (text, ts) => { const f = fold(text); return ts.every((t) => f.includes(t)); };
function matchesQuery(task) {
  const ts = terms();
  if (!ts.length) return true;
  const hay = [task.title, task.description, topic(task.topic_id)?.title, ...task.people.map((id) => person(id)?.name),
    ...S.data.notes.filter((n) => n.task_id === task.id).map((n) => n.body)].join(' ');
  return hasAll(hay, ts);
}
// Escape + <mark> oko pogodaka trenutnog upita.
function hl(text) {
  const src = String(text ?? '').normalize('NFC');
  const ts = terms();
  if (!ts.length || fold(src).length !== src.length) return esc(src);
  const f = fold(src), marks = new Array(src.length).fill(false);
  ts.forEach((t) => { for (let i = f.indexOf(t); i >= 0; i = f.indexOf(t, i + 1)) for (let j = i; j < i + t.length; j++) marks[j] = true; });
  let out = '', open = false;
  for (let i = 0; i < src.length; i++) {
    if (marks[i] !== open) { out += marks[i] ? '<mark>' : '</mark>'; open = marks[i]; }
    out += esc(src[i]);
  }
  return out + (open ? '</mark>' : '');
}

/* ========= slanje mailom (otvara korisnikov program za e-poštu) ========= */
const MAIL_MAX = 1500; // dulje poveznice neki programi za mail ne otvore
async function openMail(to, subject, body) {
  body += `\n\n— ${S.user?.name || ''}`;
  let short = body;
  if (body.length > MAIL_MAX) {
    short = body.slice(0, MAIL_MAX) + '\n\n[…tekst je skraćen — cijeli je kopiran, zalijepi ga ovdje]';
    try { await navigator.clipboard.writeText(body); } catch {}
  }
  const addr = to.filter(Boolean).join(',');
  location.href = `mailto:${addr}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(short)}`;
  if (!addr) toast('Nema e-mail adrese — upiši je u kartici „Ljudi“ ili u mail');
}
function taskMailText(k, pid) {
  const t = topic(k.topic_id);
  const lines = [`Zadatak: ${k.title}`];
  if (t) lines.push(`Tema: ${t.title}`);
  if (k.due_date) lines.push(`Rok: ${fmtDate(k.due_date)}`);
  if (k.priority === 'high') lines.push('Prioritet: HITNO');
  lines.push(`Status: ${STATUS[k.status]}`);
  if (k.description) lines.push('', k.description);
  const notes = S.data.notes.filter((n) => n.task_id === k.id && (pid ? n.person_id === pid || !n.person_id : true));
  if (notes.length) {
    lines.push('', 'Bilješke:');
    notes.forEach((n) => lines.push(`– ${n.person_id && !pid ? person(n.person_id)?.name + ': ' : ''}${n.body}`));
  }
  return lines.join('\n');
}
function mailTask(taskId, pid) {
  const k = S.data.tasks.find((x) => x.id === taskId);
  const who = pid ? [person(pid)] : k.people.map(person);
  const greet = pid ? `Bok ${person(pid).name.split(' ')[0]},\n\n` : 'Bok,\n\n';
  openMail(who.filter(Boolean).map((p) => p.email), `Zadatak: ${k.title}${k.due_date ? ` (rok ${fmtDate(k.due_date)})` : ''}`,
    greet + taskMailText(k, pid));
}
function matchesStatus(task) {
  return S.statusFilter === 'all' || (S.statusFilter === 'done' ? task.status === 'done' : task.status !== 'done');
}

/* ========= glas u tekst (Web Speech API, hrvatski) ========= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null;
function micBtn(targetId) {
  if (!SR) return '';
  return `<button type="button" class="mic" title="Diktiraj (hrvatski)" data-mic="${targetId}">🎤</button>`;
}
function toggleMic(btn) {
  const target = document.getElementById(btn.dataset.mic);
  if (!target) return;
  if (activeRec) { const same = activeRec.btn === btn; activeRec.rec.stop(); if (same) return; }
  const rec = new SR();
  rec.lang = 'hr-HR'; rec.continuous = true; rec.interimResults = true;
  const base = target.value ? target.value.replace(/\s*$/, ' ') : '';
  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript.trim() + ' ';
      else interim += r[0].transcript;
    }
    target.value = (base + finalText + interim).replace(/^\s+/, '');
    target.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onerror = (e) => { if (e.error === 'not-allowed') toast('Dopusti pristup mikrofonu u pregledniku'); };
  rec.onend = () => { btn.classList.remove('rec'); if (activeRec?.rec === rec) activeRec = null; target.value = target.value.trim(); };
  rec.start(); btn.classList.add('rec'); activeRec = { rec, btn };
}

/* Prepoznaj imena ljudi u tekstu (i padeže: Ivan → Ivanu, Ivana…) */
function peopleInText(text) {
  const words = text.toLowerCase().split(/[^\p{L}]+/u).filter(Boolean);
  return S.data.people.filter((p) => {
    const first = p.name.toLowerCase().split(/\s+/)[0];
    const stem = first.length > 3 ? first.slice(0, -1) : first;
    return words.some((w) => w === first || (w.startsWith(stem) && w.length <= first.length + 3));
  }).map((p) => p.id);
}

/* ========= prikaz ========= */
function render() {
  const app = $('#app');
  if (S.needLogin) return (app.innerHTML = loginView());
  if (!S.loaded) return (app.innerHTML = '<div class="empty">Učitavam…</div>');
  const active = document.activeElement?.id;
  const sel = active && document.activeElement.selectionStart;
  // sačuvaj nespremljene unose u bilješke/forme
  const drafts = {};
  document.querySelectorAll('[data-draft]').forEach((el) => { if (el.value) drafts[el.id] = el.value; });

  app.innerHTML = headerView() + `<main>${
    terms().length ? searchView()
      : S.view === 'people' ? peopleView() : S.view === 'person' ? personView()
      : S.view === 'admin' && S.user?.is_admin ? adminView()
      : S.view === 'calendar' ? calendarView() : S.view === 'network' ? networkView() : topicsView()
  }</main><button class="fab" data-act="quick" title="Brzi unos glasom">🎤</button>`;

  Object.entries(drafts).forEach(([id, v]) => { const el = document.getElementById(id); if (el && !el.value) el.value = v; });
  if (active) { const el = document.getElementById(active); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch {} } }
  if (S.view === 'network' && !terms().length) drawNetwork();
}

/* ---- Teme ---- */
function topicsView() {
  const { topics, tasks } = S.data;
  if (!topic(S.topicId)) S.topicId = topics.find((t) => !t.archived && !t.parent_id)?.id || topics[0]?.id || null;
  const t = topic(S.topicId);
  // otvori put do odabrane teme
  if (t) topicAncestors(t).forEach((a) => S.collapsed.delete(a.id));
  const openIn = (ids) => tasks.filter((k) => ids.has(k.topic_id) && k.status !== 'done').length;

  const rows = [];
  const walk = (list, depth) => list.forEach((x) => {
    const kids = childTopics(x.id);
    const shut = S.collapsed.has(x.id);
    const n = openIn(topicSubtree(x.id));
    rows.push(`<div class="topic-item ${x.id === S.topicId ? 'on' : ''}" data-act="topic" data-id="${x.id}"
        style="padding-left:${6 + depth * 16}px;${x.archived ? 'opacity:.5' : ''}">
      <span class="twisty" ${kids.length ? `data-act="twisty" data-id="${x.id}" title="${shut ? 'Prikaži' : 'Sakrij'} podteme"` : ''}>${kids.length ? (shut ? '▸' : '▾') : ''}</span>
      <span class="dot" style="background:${esc(x.color)}"></span><span class="grow">${esc(x.title)}</span><span class="count">${n || ''}</span></div>`);
    if (!shut) walk(kids, depth + 1);
  });
  walk(childTopics(null), 0);

  const side = `<div class="panel stack side">
      <button class="primary" data-act="newTopic" style="width:100%">+ Nova tema</button>
      <div>${rows.join('') || '<div class="muted small">Još nema tema.</div>'}</div>
    </div>`;
  if (!t) return `<div class="layout">${side}<div class="panel empty">Napravi prvu temu, npr. „Renovacija ureda“ ili „Sajam 2027“.<br>Unutar nje možeš otvoriti podteme.</div></div>`;

  const sub = topicSubtree(t.id);
  const kids = childTopics(t.id);
  const inScope = (k) => (S.withSub ? sub.has(k.topic_id) : k.topic_id === t.id);
  const tt = tasks.filter((k) => inScope(k) && matchesStatus(k) && matchesQuery(k));
  sortTasks(tt);
  const crumbs = topicAncestors(t).map((a) => `<a href="#" data-act="topic" data-id="${a.id}">${esc(a.title)}</a> › `).join('');
  const cards = kids.map((c) => {
    const ids = topicSubtree(c.id);
    const all = tasks.filter((k) => ids.has(k.topic_id));
    const open = all.filter((k) => k.status !== 'done').length;
    const subN = ids.size - 1;
    return `<button class="subcard" data-act="topic" data-id="${c.id}" style="border-left-color:${esc(c.color)};${c.archived ? 'opacity:.55' : ''}">
      <strong>${esc(c.title)}</strong>
      <span class="muted small">${open} otvorenih / ${all.length}${subN ? ` · ${subN} podtema` : ''}</span></button>`;
  }).join('');

  const mainCol = `<div class="stack">
    <div class="panel stack">
      ${crumbs ? `<div class="small muted crumbs">${crumbs}</div>` : ''}
      <div class="row">
        <span class="dot" style="background:${esc(t.color)};width:14px;height:14px"></span>
        <h2 class="grow">${esc(t.title)}</h2>
        <button class="ghost" data-act="newSubtopic" data-id="${t.id}" title="Nova podtema unutar ove teme">+ Podtema</button>
        <button class="ghost" data-act="editTopic" data-id="${t.id}">Uredi</button>
      </div>
      ${t.description ? `<div class="muted">${esc(t.description)}</div>` : ''}
      ${kids.length ? `<div class="subcards">${cards}</div>` : ''}
      ${newTaskForm(t.id)}
    </div>
    <div class="row">${filtersView()}
      ${sub.size > 1 ? `<label class="row small muted" style="gap:4px"><input type="checkbox" data-act="withSub" style="width:auto" ${S.withSub ? 'checked' : ''}> i zadaci iz podtema</label>` : ''}
      <span class="muted small" style="margin-left:auto">${tt.length} zadataka</span></div>
    <div>${tt.map((k) => taskView(k, { showTopic: S.withSub && k.topic_id !== t.id })).join('') || '<div class="panel empty">Nema zadataka za ovaj filter.</div>'}</div>
  </div>`;
  return `<div class="layout">${side}${mainCol}</div>`;
}

function sortTasks(arr) {
  const pr = { high: 0, normal: 1, low: 2 }, st = { doing: 0, todo: 1, done: 2 };
  arr.sort((a, b) => st[a.status] - st[b.status] || pr[a.priority] - pr[b.priority]
    || (a.due_date || '9999').localeCompare(b.due_date || '9999') || a.id - b.id);
}

function peopleChips(name, selected) {
  if (!S.data.people.length) return `<span class="muted small">Dodaj ljude u kartici „Ljudi“ pa ih ovdje samo klikneš.</span>`;
  return `<div class="chips" data-chips="${name}">${S.data.people.map((p) =>
    `<button type="button" class="chip ${selected.includes(p.id) ? 'on' : ''}" data-act="chip" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div>`;
}

function newTaskForm(topicId) {
  return `<form class="stack" data-form="newTask" data-topic="${topicId}">
    <div class="with-mic"><input id="nt-title" name="title" data-draft placeholder="Novi zadatak… (npr. „Marko neka nazove dobavljača“)" autocomplete="off">${micBtn('nt-title')}</div>
    <div class="with-mic"><textarea id="nt-desc" name="description" data-draft rows="1" placeholder="Opis (nije obavezno)"></textarea>${micBtn('nt-desc')}</div>
    ${peopleChips('people', [])}
    <div class="row">
      <select name="priority" style="width:auto"><option value="normal">Prioritet: normalan</option><option value="high">Prioritet: visok</option><option value="low">Prioritet: nizak</option></select>
      <input type="date" name="due_date" style="width:auto" title="Rok">
      <button class="primary" style="margin-left:auto">Dodaj zadatak</button>
    </div>
  </form>`;
}

function taskView(k, opts = {}) {
  const isOpen = S.open.has(k.id);
  const late = k.due_date && k.status !== 'done' && k.due_date < today();
  const t = topic(k.topic_id);
  const noteCount = S.data.notes.filter((n) => n.task_id === k.id).length;
  const head = `<div class="task-head" data-act="toggle" data-id="${k.id}">
    <button class="status st-${k.status}" data-act="status" data-id="${k.id}" title="Klikni za promjenu statusa">${STATUS[k.status]}</button>
    <div class="grow">
      <div class="task-title">${hl(k.title)}</div>
      <div class="row small muted" style="margin-top:4px">
        ${opts.showTopic && t ? `<span><span class="dot" style="display:inline-block;background:${esc(t.color)}"></span> ${hl(topicPath(t))}</span>` : ''}
        ${k.priority !== 'normal' ? `<span class="prio-${k.priority}">${k.priority === 'high' ? '▲ visok' : '▽ nizak'}</span>` : ''}
        ${k.due_date ? `<span class="due ${late ? 'late' : ''}">📅 ${fmtDate(k.due_date)}${late ? ' (kasni)' : ''}</span>` : ''}
        ${noteCount ? `<span>📝 ${noteCount}</span>` : ''}
      </div>
    </div>
    <div class="chips" style="justify-content:flex-end">${k.people.map((id) => person(id)).filter(Boolean)
      .map((p) => `<span class="chip static">${esc(p.name)}</span>`).join('')}</div>
  </div>`;
  if (!isOpen) return `<div class="task ${k.status}">${head}</div>`;

  const notes = S.data.notes.filter((n) => n.task_id === k.id);
  const blocks = [...k.people.map((id) => person(id)).filter(Boolean), { id: 0, name: null }]
    .filter((p) => !opts.onlyPerson || p.id === opts.onlyPerson || p.id === 0)
    .map((p) => notesBlock(k, p, notes.filter((n) => (n.person_id || 0) === p.id))).join('');

  return `<div class="task ${k.status}">${head}
    <div class="task-body stack">
      ${k.description ? `<div style="white-space:pre-wrap">${hl(k.description)}</div>` : ''}
      ${blocks}
      <div class="row">
        <button class="ghost" data-act="editTask" data-id="${k.id}">✏️ Uredi zadatak</button>
        <span class="muted small" style="margin-left:auto">Kreirano ${fmtTime(k.created_at)}</span>
      </div>
    </div></div>`;
}

function notesBlock(k, p, notes) {
  const fid = `note-${k.id}-${p.id}`;
  const mailTitle = p.name
    ? (p.email ? `Pošalji zadatak i bilješke na ${p.email}` : `${p.name} nema upisan e-mail — dodaj ga u kartici „Ljudi“`)
    : 'Pošalji zadatak sa svim bilješkama svim zaduženima';
  const canMail = p.name || k.people.length;
  return `<div class="notes-block">
    <div class="row"><h3 class="grow">${p.name ? `Bilješke za: ${esc(p.name)}` : 'Opće bilješke'}</h3>
      ${canMail ? `<button class="ghost small" data-act="mailTask" data-id="${k.id}" data-pid="${p.id}" title="${esc(mailTitle)}">✉️ Pošalji mailom</button>` : ''}</div>
    ${notes.map((n) => `<div class="note">
        <div class="note-body">${hl(n.body)}</div>
        <span class="note-time">${fmtTime(n.created_at)}</span>
        <button class="ghost small" data-act="editNote" data-id="${n.id}" title="Uredi">✏️</button>
        <button class="ghost small danger" data-act="delNote" data-id="${n.id}" title="Obriši">✕</button>
      </div>`).join('')}
    <form class="with-mic" data-form="note" data-task="${k.id}" data-person="${p.id}" style="margin-top:6px">
      <textarea id="${fid}" name="body" data-draft rows="1" placeholder="${p.name ? `Upute ili bilješka za ${esc(p.name)}…` : 'Bilješka…'}"></textarea>
      ${micBtn(fid)}<button class="primary" style="height:38px">Spremi</button>
    </form>
  </div>`;
}

/* ---- Rezultati pretrage (kroz sve teme) ---- */
function searchView() {
  const ts = terms();
  const tasks = S.data.tasks.filter(matchesQuery);
  sortTasks(tasks);
  const people = S.data.people.filter((p) => hasAll([p.name, p.role, p.email].join(' '), ts));
  const topics = S.data.topics.filter((t) => hasAll([t.title, t.description].join(' '), ts));
  const noteHits = (k) => S.data.notes.filter((n) => n.task_id === k.id && ts.some((t) => fold(n.body).includes(t)));
  const list = tasks.map((k) => {
    const hits = S.open.has(k.id) ? [] : noteHits(k);
    return taskView(k, { showTopic: true }) + (hits.length ? `<div class="hits">${hits.slice(0, 3).map((n) =>
      `<div class="small">📝 ${n.person_id ? `<strong>${esc(person(n.person_id)?.name)}:</strong> ` : ''}${hl(n.body)}</div>`).join('')}</div>` : '');
  }).join('');
  return `<div class="stack" style="max-width:900px;margin:0 auto">
    <div class="panel row">
      <h2 class="grow">Rezultati za „${esc(S.q.trim())}“</h2>
      <span class="muted small">${tasks.length} zadataka</span>
      <button class="ghost" data-act="clearSearch">✕ Očisti</button>
    </div>
    ${topics.length ? `<div class="panel row small"><span class="muted">Teme:</span>${topics.map((t) =>
      `<button class="chip" data-act="topic" data-id="${t.id}"><span class="dot" style="display:inline-block;background:${esc(t.color)}"></span> ${hl(t.title)}</button>`).join('')}</div>` : ''}
    ${people.length ? `<div class="panel row small"><span class="muted">Ljudi:</span>${people.map((p) =>
      `<button class="chip" data-act="openPerson" data-id="${p.id}">${hl(p.name)}</button>`).join('')}</div>` : ''}
    <div>${list || '<div class="panel empty">Ništa nije pronađeno. Probaj kraću riječ.</div>'}</div>
  </div>`;
}

/* ---- Po osobi ---- */

  const { people, tasks } = S.data;
  if (!person(S.personId)) S.personId = people[0]?.id || null;
  if (!S.personId) return `<div class="panel empty">Prvo dodaj ljude u kartici „Ljudi“.</div>`;
  const p = person(S.personId);
  const mine = tasks.filter((k) => k.people.includes(p.id) && matchesStatus(k) && matchesQuery(k));
  sortTasks(mine);
  return `<div class="stack" style="max-width:900px;margin:0 auto">
    <div class="panel stack">
      <div class="row">
        <select data-act="pickPerson" style="width:auto;font-weight:600">${people.map((x) =>
          `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        ${p.role ? `<span class="muted">${esc(p.role)}</span>` : ''}
        <button style="margin-left:auto" data-act="copyPerson" data-id="${p.id}" title="Kopira popis otvorenih zadataka za slanje porukom">📋 Kopiraj popis</button>

const MONTHS = ['siječanj', 'veljača', 'ožujak', 'travanj', 'svibanj', 'lipanj', 'srpanj', 'kolovoz', 'rujan', 'listopad', 'studeni', 'prosinac'];

// Blagdani i neradni dani u Hrvatskoj (Uskrs po gregorijanskom računanju).
const holidayCache = {};
function hrHolidays(y) {
  if (holidayCache[y]) return holidayCache[y];
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = new Date(y, month - 1, day);
  const fixed = { '01-01': 'Nova godina', '01-06': 'Sveta tri kralja', '05-01': 'Praznik rada', '05-30': 'Dan državnosti',
    '06-22': 'Dan antifašističke borbe', '08-05': 'Dan pobjede', '08-15': 'Velika Gospa', '11-01': 'Svi sveti',
    '11-18': 'Dan sjećanja na Vukovar', '12-25': 'Božić', '12-26': 'Sveti Stjepan' };
  const out = {};
  Object.entries(fixed).forEach(([md, n]) => { out[`${y}-${md}`] = n; });
  out[isoDate(easter)] = 'Uskrs'; out[isoDate(addDays(easter, 1))] = 'Uskrsni ponedjeljak'; out[isoDate(addDays(easter, 60))] = 'Tijelovo';
  return (holidayCache[y] = out);
}
const holiday = (iso) => hrHolidays(Number(iso.slice(0, 4)))[iso];

function networkView() {

function netElements() {
  const n = S.net, els = [];
  const scope = n.topic && topic(n.topic) ? topicSubtree(n.topic) : null;
  const topics = S.data.topics.filter((t) => !scope || scope.has(t.id));
  const tids = new Set(topics.map((t) => t.id));
  topics.forEach((t) => {
    const size = 28 + Math.min(40, (topicSubtree(t.id).size - 1) * 6 + S.data.tasks.filter((k) => k.topic_id === t.id).length * 2);
    els.push({ data: { id: 't' + t.id, kind: 'topic', ref: t.id, label: t.title, color: t.color || '#4f6bed', size, level: 3 } });
    if (t.parent_id && tids.has(t.parent_id)) els.push({ data: { id: `e-t${t.parent_id}-t${t.id}`, source: 't' + t.parent_id, target: 't' + t.id, kind: 'sub' } });
  });
  if (!n.tasks) return els;
  const tasks = S.data.tasks.filter((k) => tids.has(k.topic_id) && (n.done || k.status !== 'done'));
  const pids = new Set();
  tasks.forEach((k) => {
    const late = k.due_date && k.status !== 'done' && k.due_date < today();
    const label = k.title.length > 32 ? k.title.slice(0, 30) + '…' : k.title;
    els.push({ data: { id: 'k' + k.id, kind: 'task', ref: k.id, label, status: k.status, late: late ? 1 : 0, level: 2 } });
    els.push({ data: { id: `e-t${k.topic_id}-k${k.id}`, source: 't' + k.topic_id, target: 'k' + k.id, kind: 'has' } });
    if (n.people) k.people.forEach((pid) => { pids.add(pid); els.push({ data: { id: `e-k${k.id}-p${pid}`, source: 'k' + k.id, target: 'p' + pid, kind: 'who' } }); });
    if (n.notes) S.data.notes.filter((x) => x.task_id === k.id).forEach((x) => {
      els.push({ data: { id: 'n' + x.id, kind: 'note', ref: x.id, label: x.body.length > 26 ? x.body.slice(0, 24) + '…' : x.body, level: 1 } });
      els.push({ data: { id: `e-n${x.id}`, source: 'k' + k.id, target: 'n' + x.id, kind: 'note' } });
      if (n.people && x.person_id && k.people.includes(x.person_id)) els.push({ data: { id: `e-n${x.id}-p`, source: 'n' + x.id, target: 'p' + x.person_id, kind: 'notefor' } });
    });
  });
  S.data.people.filter((p) => pids.has(p.id)).forEach((p) => els.push({ data: { id: 'p' + p.id, kind: 'person', ref: p.id, label: p.name, level: 0 } }));
  return els;
}
const NET_STYLE = [

async function drawNetwork() {
  const el = document.getElementById('net');
  if (!el) return;
  let lib;
  try { lib = await loadCytoscape(); } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!document.body.contains(el)) return;
  const els = netElements();
  if (!els.length) { el.innerHTML = '<div class="empty">Još nema tema. Napravi ih u kartici „Teme“.</div>'; return; }
  const key = JSON.stringify([S.net, els.map((x) => x.data.id)]);
  const cached = S.netCache?.key === key ? S.netCache.pos : null;
  cy?.destroy();
  cy = lib({ container: el, elements: els, style: NET_STYLE, wheelSensitivity: 0.25, minZoom: 0.1, maxZoom: 3 });
  const roots = cy.nodes('[kind="topic"]').filter((nd) => nd.incomers('edge[kind="sub"]').empty());
  const layout = cached ? { name: 'preset', positions: (nd) => cached[nd.id()] }
    : S.net.layout === 'breadthfirst' ? { name: 'breadthfirst', directed: true, roots, spacingFactor: 1.1, animate: false }
    : S.net.layout === 'concentric' ? { name: 'concentric', concentric: (nd) => nd.data('level'), levelWidth: () => 1, minNodeSpacing: 18, animate: false }
    : { name: 'cose', animate: false, nodeRepulsion: () => 26000, nodeOverlap: 20, idealEdgeLength: (ed) => (ed.data('kind') === 'sub' ? 150 : 85),
        componentSpacing: 120, gravity: 0.35, numIter: 2500, randomize: true, padding: 30 };
  cy.layout(layout).run();
  if (cached && S.netCache.view) cy.viewport(S.netCache.view); else cy.fit(undefined, 30);
  const remember = () => {
    const pos = {}; cy.nodes().forEach((nd) => { pos[nd.id()] = { ...nd.position() }; });
    S.netCache = { key, pos, view: { zoom: cy.zoom(), pan: { ...cy.pan() } } };
  };
  remember();
  cy.on('dragfree viewport', remember);
  cy.on('tap', 'node', (e) => netSelect(e.target));
  cy.on('tap', (e) => { if (e.target === cy) { cy.elements().removeClass('faded'); $('#net-info').hidden = true; } });
}
function netSelect(nd) {

  cy.elements().addClass('faded'); near.removeClass('faded');
  const box = $('#net-info'), ref = nd.data('ref');
  let html = '';
  if (nd.data('kind') === 'topic') {
    const t = topic(ref), ids = topicSubtree(ref), all = S.data.tasks.filter((k) => ids.has(k.topic_id));
    html = `<div class="small muted">Tema</div><h3>${esc(topicPath(t))}</h3>
      <div class="small">${all.filter((k) => k.status !== 'done').length} otvorenih / ${all.length} zadataka${ids.size > 1 ? ` · ${ids.size - 1} podtema` : ''}</div>
      <div class="row"><button data-act="topic" data-id="${ref}">Otvori temu →</button><button data-act="netFocus" data-id="${ref}">Samo ova grana</button></div>`;
  } else if (nd.data('kind') === 'task') {
    const k = S.data.tasks.find((x) => x.id === ref);
    html = `<div class="small muted">Zadatak · ${esc(topicPath(topic(k.topic_id)))}</div><h3>${esc(k.title)}</h3>
      <div class="small">${STATUS[k.status]}${k.due_date ? ` · rok ${fmtDate(k.due_date)}` : ''}${k.people.length ? ' · ' + esc(k.people.map((i) => person(i)?.name).join(', ')) : ''}</div>
      <div class="row"><button data-act="calTask" data-id="${ref}">Detalji</button></div>`;
  } else if (nd.data('kind') === 'person') {
    const p = person(ref), mine = S.data.tasks.filter((k) => k.people.includes(ref));
    html = `<div class="small muted">Osoba</div><h3>${esc(p.name)}</h3>
      <div class="small">${mine.filter((k) => k.status !== 'done').length} otvorenih / ${mine.length} zadataka${p.email ? ' · ' + esc(p.email) : ''}</div>
      <div class="row"><button data-act="openPerson" data-id="${ref}">Zadaci osobe →</button></div>`;
  } else {
    const x = S.data.notes.find((y) => y.id === ref);
    html = `<div class="small muted">Bilješka${x.person_id ? ' za ' + esc(person(x.person_id)?.name) : ''}</div>
      <div style="white-space:pre-wrap">${esc(x.body)}</div>
      <div class="row"><button data-act="calTask" data-id="${x.task_id}">Zadatak</button></div>`;
  }
  box.innerHTML = html + `<button class="ghost net-x" data-act="netClose" title="Zatvori">✕</button>`;
  box.hidden = false;
}

/* ========= brzi unos uz AI ========= */
async function parseText(text) {
  const res = await fetch('/api/parse', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, topic_hint: S.view === 'topics' ? topic(S.topicId)?.title : null }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || 'Greška ' + res.status);
  return json;
}

function quickStep1(text = '') {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form class="stack" data-qa="parse">
    <h2>⚡ Brzi unos</h2>
    <div class="muted small">Izdiktiraj ili upiši, npr. <em>„Marko do petka naruči štand za sajam, budžet 2000 eura“</em>. AI će predložiti temu, osobu, rok i bilješke — ti samo potvrdiš.</div>
    <div class="with-mic"><textarea id="qa-text" class="qa-text" name="text" required>${esc(text)}</textarea>${micBtn('qa-text')}</div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" onclick="this.closest('dialog').close()">Odustani</button>
      <button class="primary" id="qa-go">Obradi ✨</button>
    </div></form>`;
  if (!dlg.open) dlg.showModal();
  const ta = $('#qa-text');
  ta.focus();
  // na mobitelu odmah kreni slušati
  const mic = $('[data-mic="qa-text"]', dlg);
  if (mic && !text && matchMedia('(pointer: coarse)').matches) toggleMic(mic);
  $('form', dlg).onsubmit = async (e) => {
    e.preventDefault();
    if (activeRec) activeRec.rec.stop();
    const t = ta.value.trim(); if (!t) return;
    const btn = $('#qa-go'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Obrađujem…';
    try {
      const p = await parseText(t);
      if (p.remaining != null && p.remaining <= 5) toast(`Brzi unos: danas još ${p.remaining}`);
      quickStep2(t, p);
    }
    catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Obradi ✨'; }
  };
}

function quickStep2(text, p) {
  const dlg = $('#dlg');
  const topicOpts = topicOptions(p.topic_id, { hideArchived: true });
  const newTopic = p.new_topic || (!p.topic_id && !S.data.topics.length ? 'Opće' : null);
  const fallbackTopic = !p.topic_id && !newTopic ? (S.topicId || S.data.topics[0]?.id) : null;
  const chips = S.data.people.map((x) =>
    `<button type="button" class="chip ${p.people.includes(x.id) ? 'on' : ''}" data-act="chip" data-id="${x.id}">${esc(x.name)}</button>`).join('')
    + p.new_people.map((n) => `<button type="button" class="chip new on" data-act="chip" data-new="${esc(n)}" title="Nova osoba — bit će dodana na popis">+ ${esc(n)}</button>`).join('');
  const noteRow = (n, i) => `<div class="qa-note" data-note data-pid="${n.person_id || ''}" data-pname="${esc(n.person_name || '')}">
      <span class="lbl">${n.person_name ? 'za ' + esc(n.person_name) : 'Opća'}</span>
      <textarea rows="1">${esc(n.body)}</textarea>
      <button type="button" class="ghost danger" onclick="this.parentElement.remove()" title="Makni">✕</button></div>`;

  dlg.innerHTML = `<form class="stack" data-qa="save">
    <h2>Provjeri i spremi</h2>
    <div class="muted small">„${esc(text)}“</div>
    <label class="small muted">Tema</label>
    <select name="topic">${newTopic ? `<option value="new" selected>➕ Nova tema: ${esc(newTopic)}</option>` : ''}${topicOpts.replace(`value="${fallbackTopic}"`, `value="${fallbackTopic}" selected`)}</select>
    <input name="title" required value="${esc(p.title)}" placeholder="Naziv zadatka" style="font-weight:600">
    <textarea name="description" rows="1" placeholder="Opis (nije obavezno)">${esc(p.description)}</textarea>
    <div class="chips" data-chips="people">${chips || '<span class="muted small">Nema ljudi.</span>'}</div>
    <div class="row">
      <select name="priority" style="width:auto">${Object.entries(PRIO).map(([v, l]) => `<option value="${v}" ${v === p.priority ? 'selected' : ''}>Prioritet: ${l.toLowerCase()}</option>`).join('')}</select>
      <input type="date" name="due_date" value="${p.due_date || ''}" style="width:auto" title="Rok">
    </div>
    ${p.notes.length ? `<label class="small muted">Bilješke</label><div class="stack">${p.notes.map(noteRow).join('')}</div>` : ''}
    <div class="row" style="justify-content:flex-end">
      <button type="button" data-qa-back>← Natrag</button>
      <button class="primary" id="qa-save">Spremi zadatak</button>
    </div></form>`;
  $('[data-qa-back]', dlg).onclick = () => quickStep1(text);
  $('form', dlg).onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, fd = new FormData(f);
    const on = [...f.querySelectorAll('[data-chips] .chip.on')];
    const newPeople = on.filter((c) => c.dataset.new).map((c) => c.dataset.new);
    const notes = [...f.querySelectorAll('[data-note]')].map((el) => ({
      person_id: Number(el.dataset.pid) || null,
      person_name: el.dataset.pname || null,
      body: $('textarea', el).value,
    })).filter((n) => n.body.trim())
      // bilješka za novu osobu koju je korisnik odznačio postaje opća
      .map((n) => (!n.person_id && n.person_name && !newPeople.includes(n.person_name) ? { ...n, person_name: null } : n));
    $('#qa-save').disabled = true;
    try {
      const data = await api({
        op: 'quickAdd',
        topic_id: fd.get('topic') === 'new' ? null : Number(fd.get('topic')),
        new_topic: fd.get('topic') === 'new' ? newTopic : null,
        title: fd.get('title'), description: fd.get('description'),
        priority: fd.get('priority'), due_date: fd.get('due_date'),
        people: on.filter((c) => !c.dataset.new).map((c) => Number(c.dataset.id)),
        new_people: newPeople, notes,
      });
      dlg.close();
      S.view = 'topics'; S.topicId = data.result.topic_id; S.open.add(data.result.task_id); S.statusFilter = 'open';
      save(); render(); toast('Zadatak spremljen ✓');
    } catch { $('#qa-save').disabled = false; }
  };
}

/* ========= događaji ========= */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act], [data-mic]');
  if (!el) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  if (el.dataset.mic) { e.preventDefault(); return toggleMic(el); }
  if (el.tagName === 'SELECT') return; // padajući izbornici se obrađuju na 'change'
  const id = Number(el.dataset.id);
  const act = el.dataset.act;
  if (act !== 'toggle') e.stopPropagation();
  switch (act) {
    case 'view': S.view = el.dataset.v; S.q = ''; if (S.view === 'admin') S.admin = null; save(); return render();
    case 'topic': S.topicId = id; S.view = 'topics'; S.q = ''; save(); return render();
    case 'clearSearch': S.q = ''; return render();
    case 'calMode': S.cal.mode = el.dataset.v; save(); return render();
    case 'calNav': {
      const v = Number(el.dataset.v), a = parseDate(S.cal.anchor || today());
      S.cal.anchor = v === 0 ? today() : isoDate(S.cal.mode === 'week' ? addDays(a, 7 * v) : new Date(a.getFullYear(), a.getMonth() + v, 1));
      return render();
    }
    case 'calDone': S.cal.done = el.checked; save(); return render();
    case 'calTask': { const k = S.data.tasks.find((x) => x.id === id); return k && taskInfo(k); }
    case 'calDay': return dayDialog(el.dataset.day);
    case 'calNew': if ($('#dlg').open) $('#dlg').close(); return newTaskOnDay(el.dataset.day);
    case 'infoStatus': {
      const k = S.data.tasks.find((x) => x.id === id);
      await run('setStatus', { id, status: k.status === 'done' ? 'todo' : 'done' });
      const k2 = S.data.tasks.find((x) => x.id === id); if (k2 && $('#dlg').open) taskInfo(k2);
      return;
    }
    case 'infoEdit': $('#dlg').close(); return taskDialog(S.data.tasks.find((x) => x.id === id));
    case 'infoOpen': {
      const k = S.data.tasks.find((x) => x.id === id);
      $('#dlg').close(); S.view = 'topics'; S.topicId = k.topic_id; S.open.add(id); S.statusFilter = k.status === 'done' ? 'all' : S.statusFilter; S.q = '';
      save(); render(); setTimeout(() => document.querySelector(`.task-head[data-id="${id}"]`)?.scrollIntoView({ block: 'center' }), 30);
      return;
    }
    case 'netOpt': S.net[el.dataset.k] = el.checked; save(); return render();
    case 'netFit': return cy?.fit(undefined, 30);
    case 'netFocus': S.net.topic = id; save(); return render();
    case 'netClose': cy?.elements().removeClass('faded'); $('#net-info').hidden = true; return;
    case 'mailTask': return mailTask(id, Number(el.dataset.pid) || null);
    case 'mailPerson': {
      const p = person(id);
      return openMail([p.email], 'Tvoji otvoreni zadaci', personSummary(id));
    }
    case 'userMenu': return userMenu();
    case 'changePw': $('#dlg').close(); return changePwDialog();
    case 'logout':
      $('#dlg').close();
      try { await authOp('logout'); } catch {}
      Object.assign(S, { user: null, loaded: false, needLogin: true, auth: { mode: 'login' }, admin: null, q: '',
        data: { people: [], topics: [], tasks: [], notes: [] } });
      S.open.clear();
      return render();
    case 'toLogin': history.replaceState(null, '', location.pathname); S.auth = { mode: 'login' }; return render();
    case 'copyText':
      try { await navigator.clipboard.writeText(el.dataset.text); toast('Kopirano ✓'); } catch { toast('Označi poveznicu i kopiraj ručno'); }
      return;
    case 'resetUser': {
      const u = S.admin.users.find((x) => x.id === id);
      try {
        const r = await authOp('createReset', { user_id: id });
        const url = `${location.origin}/?reset=${r.token}`;
        S.admin.link = { label: `Poveznica za novu lozinku — ${u.name} (vrijedi ${r.hours} h)`, url,
          subject: 'Delegator — nova lozinka', body: `Bok ${u.name.split(' ')[0]},\n\novdje postavi novu lozinku za Delegator:\n${url}\n\nPoveznica vrijedi ${r.hours} sata.` };
        loadAdmin();
      } catch (e) { toast(e.message); }
      return;
    }
    case 'delUser': {
      const u = S.admin.users.find((x) => x.id === id);
      if (prompt(`Ovo trajno briše korisnika ${u.name} i SVE njegove teme, zadatke, ljude i bilješke.\nZa potvrdu upiši njegov e-mail:`) !== u.email) return toast('Nije obrisano');
      try { await authOp('deleteUser', { user_id: id }); toast('Korisnik obrisan'); loadAdmin(); } catch (e) { toast(e.message); }
      return;
    }
    case 'filter': S.statusFilter = el.dataset.v; return render();
    case 'toggle': if (e.target.closest('button, a, input, textarea, select, form')) return;
      S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render();
    case 'status': { const k = S.data.tasks.find((x) => x.id === id); return run('setStatus', { id, status: NEXT_STATUS[k.status] }); }
    case 'chip': el.classList.toggle('on'); el.dataset.manual = '1'; return;
    case 'quick': return quickStep1();
    case 'newTopic': return topicDialog(null);
    case 'newSubtopic': return topicDialog(null, id);
    case 'twisty': S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); save(); return render();
    case 'withSub': S.withSub = el.checked; save(); return render();
    case 'editTopic': return topicDialog(topic(id));
    case 'delTopic': {
      const n = topicSubtree(id).size - 1;
      if (confirm(`Obrisati temu${n ? ` i ${n} podtema` : ''} sa svim zadacima i bilješkama? Ovo se ne može vratiti.`)) {
        $('#dlg').close(); S.topicId = topic(id)?.parent_id || null; run('deleteTopic', { id });
      }
      return;
    }
    case 'editTask': return taskDialog(S.data.tasks.find((x) => x.id === id));
    case 'delTask': if (confirm('Obrisati zadatak i njegove bilješke?')) { $('#dlg').close(); run('deleteTask', { id }); } return;
    case 'editNote': return noteDialog(S.data.notes.find((x) => x.id === id));
    case 'delNote': if (confirm('Obrisati bilješku?')) run('deleteNote', { id }); return;
    case 'editPerson': return personDialog(person(id));
    case 'delPerson': if (confirm(`Ukloniti osobu ${person(id).name}? Bit će maknuta sa svih zadataka.`)) run('deletePerson', { id }); return;
    case 'openPerson': S.personId = id; S.view = 'person'; S.q = ''; save(); return render();
    case 'copyPerson': {
      const text = personSummary(id);
      try { await navigator.clipboard.writeText(text); toast('Popis kopiran — zalijepi u poruku ili mail'); }
      catch { openDialog(`<h2>Popis zadataka</h2><textarea rows="12">${esc(text)}</textarea>`, () => {}); }
      return;
    }
  }
});

document.addEventListener('change', (e) => {
  const act = e.target.dataset.act, v = Number(e.target.value);
  if (act === 'pickPerson') { S.personId = v; save(); render(); }
  if (act === 'calPerson') { S.cal.person = v; save(); render(); }
  if (act === 'calTopic') { S.cal.topic = v; save(); render(); }
  if (act === 'netTopic') { S.net.topic = v; save(); render(); }
  if (act === 'netLayout') { S.net.layout = e.target.value; S.netCache = null; save(); render(); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { S.q = e.target.value; render(); return; }

  // automatski označi ljude spomenute u naslovu novog zadatka
  if (e.target.id === 'nt-title' || e.target.id === 'nt-desc') {
    const form = e.target.form;
    const found = peopleInText(form.title.value + ' ' + form.description.value);
    form.querySelectorAll('[data-chips] .chip').forEach((c) => {
      if (c.dataset.manual) return;
      c.classList.toggle('on', found.includes(Number(c.dataset.id)));
    });
  }
});

// Kalendar: povuci zadatak na drugi dan = novi rok
let dragTask = null;
document.addEventListener('dragstart', (e) => {
  const chip = e.target.closest?.('.cchip');
  if (!chip) return;
  dragTask = Number(chip.dataset.id);
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragTask));
});
document.addEventListener('dragover', (e) => {
  const day = dragTask && e.target.closest?.('[data-day].cday, [data-day].cl-day');
  if (!day) return;
  e.preventDefault();
  document.querySelectorAll('.drop').forEach((x) => x !== day && x.classList.remove('drop'));
  day.classList.add('drop');
});
document.addEventListener('drop', (e) => {
  const day = dragTask && e.target.closest?.('[data-day].cday, [data-day].cl-day');
  if (!day) return;
  e.preventDefault();
  const id = dragTask; dragTask = null;
  const k = S.data.tasks.find((x) => x.id === id);
  if (k && k.due_date !== day.dataset.day) run('setDue', { id, due_date: day.dataset.day }).then(() => toast(`Rok: ${fmtDate(day.dataset.day)}`));
  else render();
});
document.addEventListener('dragend', () => { dragTask = null; document.querySelectorAll('.drop').forEach((x) => x.classList.remove('drop')); });

// Enter u bilješci = spremi (Shift+Enter = novi red); Esc u tražilici = očisti
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && e.target.id === 'search' && S.q) { e.preventDefault(); S.q = ''; render(); return; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('form[data-form="note"] textarea')) {
    e.preventDefault(); e.target.form.requestSubmit();
  }
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  const kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (activeRec) activeRec.rec.stop();
  const fd = Object.fromEntries(new FormData(f));
  if (kind === 'login' || kind === 'signup' || kind === 'reset') {
    const btn = $('button.primary', f); btn.disabled = true;
    try {
      if (kind === 'login') await authOp('login', fd);
      if (kind === 'signup') await authOp('signup', { ...fd, invite: S.auth.mode === 'setup' ? fd.invite : S.auth.token });
      if (kind === 'reset') await authOp('resetPassword', { token: S.auth.token, password: fd.password });
      history.replaceState(null, '', location.pathname);
      S.auth = { mode: 'login' };
      return api().catch(() => {});
    } catch (err) { $('.auth-err', f).textContent = err.message; btn.disabled = false; return; }
  }
  if (kind === 'invite') {
    try {
      const r = await authOp('createInvite', fd);
      const url = `${location.origin}/?pozivnica=${r.token}`;
      S.admin.link = { label: `Pozivnica${fd.note ? ' — ' + fd.note : ''} (vrijedi ${r.days} dana)`, url,
        subject: `${S.user.name} te poziva u Delegator`,
        body: `Bok,\n\npozivam te u Delegator — aplikaciju za teme, zadatke i bilješke.\nNapravi račun ovdje:\n${url}\n\nPoveznica vrijedi ${r.days} dana.\n\n— ${S.user.name}` };
      loadAdmin();
    } catch (err) { toast(err.message); }
    return;
  }
  if (kind === 'newPerson') {
    if (!fd.name.trim()) return;
    f.reset(); await run('addPerson', fd); return;
  }
  if (kind === 'newTask') {
    if (!fd.title.trim()) return toast('Upiši naziv zadatka');
    const people = selectedChips(f);
    f.reset();
    await run('addTask', { ...fd, topic_id: Number(f.dataset.topic), people });
    return;
  }
  if (kind === 'note') {
    if (!fd.body.trim()) return;
    f.reset();
    await run('addNote', { task_id: Number(f.dataset.task), person_id: Number(f.dataset.person) || null, body: fd.body });
  }
});

/* ========= pokretanje ========= */
async function boot() {
  render();
  const params = new URLSearchParams(location.search);
  const inv = params.get('pozivnica'), rst = params.get('reset');
  let me = { user: null, setup: false };
  try { me = await (await fetch('/api/auth')).json(); } catch { toast('Nema veze s poslužiteljem'); }
  if (rst) {
    S.auth = { mode: 'reset', token: rst, info: await authOp('tokenInfo', { token: rst, kind: 'reset' }).catch(() => ({ valid: false })) };
    S.needLogin = true; return render();
  }
  if (me.user) {
    if (inv) { history.replaceState(null, '', location.pathname); toast('Već si prijavljen'); }
    return api().catch(() => {});
  }
  if (inv) S.auth = { mode: 'signup', token: inv, info: await authOp('tokenInfo', { token: inv }).catch(() => ({ valid: false })) };
  else S.auth = { mode: me.setup ? 'setup' : 'login' };
  S.needLogin = true; render();
}
boot();
</script>
</body>
</html>
